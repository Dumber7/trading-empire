window.addEventListener("error",function(e){document.getElementById("app").innerHTML="<div style=\"padding:28px;color:white;font-family:system-ui\"><h2>Game could not start</h2><p>"+String(e.message).replace(/</g,"&lt;")+"</p><p>Try opening this as a hosted website in Safari.</p></div>"});
const ART='';
const TYPES=[['Used car stereo',18,52,1,'📻'],['Headlight pair',30,85,2,'💡'],['Tool bundle',25,75,2,'🧰'],['Alloy wheel',35,85,3,'🛞'],['Roof rack',40,105,3,'🚙'],['Used alternator',55,125,3,'🔩'],['Set of alloy wheels',120,285,8,'🛞'],['Turbocharger',180,410,4,'🌀'],['Gearbox',250,560,10,'⚙️'],['Engine',440,950,14,'🔧'],['Performance wheel set',850,1800,9,'🏁'],['Rare engine',1900,4100,15,'⚙️'],['Collector wheel set',3900,8000,10,'🛞'],['Race engine',8200,17500,18,'🏎️']];
const CAR_TYPES=[['Kestrel City',2008,750,'🚗'],['Valken Sprint',2012,1450,'🚙'],['Bavaro 320R',2005,2200,'🚘'],['Kestrel GT',2009,3700,'🏎️'],['Velora Roadster',2006,5800,'🏎️'],['Bavaro Classic',1992,11000,'🚘'],['Valken RS',2018,21000,'🚗'],['Velora Grand Tourer',2017,39000,'🏎️'],['Aurelio GT-R',2021,82000,'🏎️'],['Solstice V12',2023,180000,'🏎️'],['Aurelio Hyper GT',2025,440000,'🏎️']];
const PROPS=[['Bedroom shelves',0,5,0,0],['Garden shed',400,20,0,0],['Home garage',1800,55,1,5],['Small workshop',6500,130,3,20],['Car forecourt',25000,350,9,65],['Large dealership',110000,1200,30,200],['Luxury showroom',450000,3500,65,650]];
const cashfmt=n=>'£'+Math.round(n).toLocaleString('en-GB');let state,tab='home',message='',selectedCategory='all';
function rand(){state.seed=(Math.imul(state.seed,1664525)+1013904223)>>>0;return state.seed/4294967296}
function newLot(type,auction=false){const affordable=TYPES.filter(t=>t[1]<=Math.max(65,state.cash*1.8+state.revenue*.12));const pool=affordable.length?affordable:TYPES.slice(0,5);const t=pool[Math.floor(rand()*pool.length)];const condition=Math.floor(rand()*3);const base=Math.max(5,Math.round(t[1]*(.65+rand()*.55)));return{id:state.nextId++,kind:'part',name:t[0],icon:t[4],cost:base,retail:Math.round(t[2]*(.85+rand()*.35)),space:t[3],condition,repair:condition===0?Math.round(t[1]*.23):0,listed:false,ask:0,auction,days:0}}
function newCar(auction=false){const eligible=CAR_TYPES.filter(t=>t[2]<=Math.max(2500,state.cash*2+state.revenue*.15));const t=eligible[Math.floor(rand()*eligible.length)];const condition=Math.floor(rand()*3);const retail=Math.round(t[2]*(.85+rand()*.35));return{id:state.nextId++,kind:'car',name:t[0],year:t[1],icon:t[3],miles:Math.round((30+rand()*160))*1000,cost:Math.round(retail*(.48+rand()*.24)),retail,space:15,condition,repair:condition===0?Math.round(retail*.24):condition===1?Math.round(retail*.08):0,listed:false,ask:0,auction,days:0}}
function fixLegacyCar(x){if(x.kind==='car'){const old={'Ford Fiesta':'Kestrel City','Vauxhall Corsa':'Valken Sprint','BMW E46 320d':'Bavaro 320R','VW Golf GTI':'Kestrel GT','Mazda MX-5':'Velora Roadster','BMW E30':'Bavaro Classic','Porsche Boxster':'Velora Roadster','Range Rover':'Valken RS'};x.name=old[x.name]||x.name;const t=CAR_TYPES.find(t=>t[0]===x.name)||CAR_TYPES[0];if(!x.icon||x.icon==='undefined')x.icon=t[3];if(!Number.isFinite(x.retail)||x.retail<100)x.retail=t[2];if(!Number.isFinite(x.cost)||x.cost<1)x.cost=Math.round(x.retail*.6)}return x}
function refill(){state.market=Array.from({length:10},()=>newLot());if(state.day>2)state.market.push(...Array.from({length:5},()=>newCar()));state.auctions=Array.from({length:7},()=>rand()<.5?newLot(true):newCar(true));state.auctions.forEach(x=>{x.cost=Math.max(5,Math.round(x.cost*(.75+rand()*.2)));x.rival=Math.round(x.cost*(1.04+rand()*.25));x.bids=0})}
function initial(){state={cash:100,day:1,property:0,inventory:[],market:[],auctions:[],revenue:0,profit:0,sold:0,seed:73127,nextId:1,log:['Opened your business with £100. Find a bargain and flip it!'],rep:50,marketing:0,marketingDays:0,freePostDay:0,staff:{lister:false,mechanic:false},starterClaimed:false};refill();save()}
function load(){try{const s=JSON.parse(localStorage.getItem('tradingEmpireAutomotiveV1'));if(s&&typeof s.cash==='number'&&Array.isArray(s.inventory)){state=s;state.marketing??=0;state.marketingDays??=0;state.freePostDay??=0;state.staff??={lister:false,mechanic:false};state.starterClaimed??=true;state.inventory.forEach(fixLegacyCar);(state.market||[]).forEach(fixLegacyCar);(state.auctions||[]).forEach(fixLegacyCar);save();return}}catch(e){}initial()}
function save(){try{localStorage.setItem('tradingEmpireAutomotiveV1',JSON.stringify(state))}catch(e){}}
function notify(s,err=false){message=(err?'ERROR: ':'')+s;render()}
function log(s){state.log.unshift('Day '+state.day+': '+s);state.log=state.log.slice(0,10)}
function used(){return state.inventory.reduce((s,x)=>s+x.space,0)}function carCount(){return state.inventory.filter(x=>x.kind==='car').length}
function worth(){return state.cash+PROPS[state.property][1]+state.inventory.reduce((s,x)=>s+x.retail*(x.condition===0?.55:x.condition===1?.8:1),0)}
function buy(id,auction=false){const source=auction?state.auctions:state.market;const x=source.find(x=>x.id===id);if(!x)return;const price=auction?x.cost+Math.max(5,Math.round(x.cost*.12))*x.bids:x.cost;if(auction&&x.bids>0&&price<x.rival){x.bids++;log('A rival outbid you on '+x.name);save();return notify('Outbid! A rival bidder has raised the price.')}if(state.cash<price)return notify('Not enough money.',true);if(used()+x.space>PROPS[state.property][2])return notify('Not enough storage. Upgrade your property.',true);if(x.kind==='car'&&carCount()>=PROPS[state.property][3])return notify('No available car parking spaces.',true);state.cash-=price;source.splice(source.indexOf(x),1);state.inventory.push({...x,cost:price,listed:false,ask:0});log('Bought '+x.name+' for '+cashfmt(price));save();notify('Purchased '+x.name+' for '+cashfmt(price))}
function repair(id){const x=state.inventory.find(x=>x.id===id);if(!x||x.condition===2)return;const price=Math.max(1,Math.round((x.repair||x.retail*.08)*(state.staff.mechanic?.6:1)));if(state.cash<price)return notify('Not enough money for preparation.',true);state.cash-=price;x.prepSpent=(x.prepSpent||0)+price;x.condition=2;x.repair=0;x.listed=false;log('Prepared '+x.name+' for '+cashfmt(price));save();notify('Item prepared. Its value has improved.')}
function previewAppeal(id,val){const x=state.inventory.find(x=>x.id===id);if(!x)return;const price=Number(val);if(!Number.isFinite(price)||price<1)return;const el=document.getElementById('appeal'+id);if(el){const a=appeal({...x,ask:price});el.textContent=a+'/100 · Potential profit '+cashfmt(price-x.cost-(x.prepSpent||0));}}
function list(id){const x=state.inventory.find(x=>x.id===id);if(!x)return;const input=document.getElementById('ask'+id);const price=Math.round(Number(input?.value));if(!Number.isFinite(price)||price<1)return notify('Enter a valid asking price.',true);x.ask=price;x.listed=true;x.days=0;log('Listed '+x.name+' for '+cashfmt(price));save();notify('Listing published. Advance the day to attract buyers.')}
function accept(id){const x=state.inventory.find(x=>x.id===id);if(!x||!x.offer)return;const amount=x.offer;state.cash+=amount;state.revenue+=amount;state.profit+=amount-x.cost-(x.prepSpent||0);state.sold++;state.rep=Math.min(100,state.rep+1);state.inventory.splice(state.inventory.indexOf(x),1);log('Sold '+x.name+' for '+cashfmt(amount));save();notify('Sold for '+cashfmt(amount)+'!')}
function reject(id){const x=state.inventory.find(x=>x.id===id);if(x){x.offer=0;log('Declined an offer on '+x.name)}save();render()}
function upgrade(){const p=PROPS[state.property+1];if(!p)return;if(state.cash<p[1])return notify('Not enough cash.',true);state.cash-=p[1];state.property++;log('Moved into '+p[0]);save();notify('Property upgraded! You now have '+p[2]+' storage spaces.')}
function nextDay(){state.day++;state.marketingDays=Math.max(0,state.marketingDays-1);const wages=(state.staff.lister?12:0)+(state.staff.mechanic?18:0);const rent=PROPS[state.property][4]+wages;state.cash-=rent;let sales=0;for(const x of state.inventory){if(state.staff.lister&&!x.listed){x.ask=Math.max(1,Math.round(x.retail*(x.condition===0?.68:x.condition===1?.84:.97)));x.listed=true;x.days=0}if(!x.listed)continue;x.days++;if(x.offer)continue;if(rand()<saleChance(x)){x.offer=Math.round(Math.min(x.ask,x.retail*(.78+rand()*.23)));sales++}}refill();log('New listings arrived; '+sales+' buyer offer(s). Costs '+cashfmt(rent));save();notify('Day '+state.day+' started. '+sales+' new offer(s) received.')}
function appeal(x){const ratio=(x.ask||x.retail)/Math.max(1,x.retail);const popular=['Tool bundle','Used car stereo','Alloy wheel','Headlight pair','Set of alloy wheels'];const base=x.kind==='car'?53:popular.includes(x.name)?78:58;return Math.max(5,Math.min(98,Math.round(base+(1-ratio)*95+(x.condition-1)*12+(state.rep-50)*.16)))}
function saleChance(x){return Math.min(.94,Math.max(.02,appeal(x)/150*(state.marketingDays>0?1.5:1)*(state.freePostDay===state.day?1.18:1)))}
function campaign(type){if(type==='post'){if(state.freePostDay===state.day)return notify('Already posted today. Come back tomorrow.',true);state.freePostDay=state.day;log('Shared a free social post');save();return notify('Social post published! Extra buyer interest today.')}if(state.cash<25)return notify('You need £25 to advertise.',true);state.cash-=25;state.marketingDays=3;log('Started a 3-day local advertising campaign');save();notify('Advertising active for 3 days! More buyers will see your stock.')}
function marketing(){return `<section class="panel"><h2>📣 Get more customers</h2><p class="muted">Marketing helps people discover your listings. Start free or pay for a bigger boost.</p><div class="cards"><article class="card"><div class="art">📱</div><h3>Social media post</h3><div class="price">FREE</div><p class="muted">A small boost to your listings today. Once per day.</p><button class="green" onclick="campaign('post')" ${state.freePostDay===state.day?'disabled':''}>${state.freePostDay===state.day?'Posted today':'Share a post'}</button></article><article class="card"><div class="art">📣</div><h3>Local advertising</h3><div class="price">£25</div><p class="muted">Around 50% more buyer interest for 3 days.</p><button onclick="campaign('ad')" ${state.cash<25?'disabled':''}>Run campaign</button></article></div><p class="notice">${state.marketingDays>0?'Local ads active: '+state.marketingDays+' days remaining':'No paid campaign active'}</p><h3>⭐ Reputation: ${state.rep}/100</h3><p class="muted">Successful sales build your reputation, helping your items look more attractive.</p></section>`}
function hire(role){state.staff??={lister:false,mechanic:false};const cost=role==='lister'?650:1100;if(state.staff[role])return;if(state.cash<cost)return notify('Not enough cash to hire.',true);state.cash-=cost;state.staff[role]=true;log('Hired '+(role==='lister'?'sales assistant':'mechanic'));save();notify('New staff hired!')}
function starterFind(){if(state.starterClaimed)return notify('Starter bargain already claimed.',true);const x={id:state.nextId++,kind:'part',name:'Garage clearance tool kit',icon:'🧰',cost:20,retail:75,space:2,condition:1,repair:12,listed:false,ask:0,days:0};if(state.cash<20||used()+2>PROPS[state.property][2])return notify('Need £20 and 2 free storage spaces.',true);state.cash-=20;state.inventory.push(x);state.starterClaimed=true;log('Found a £20 garage clearance bargain!');save();notify('Nice find! Open Stock to list your tool kit.')}
function upgrades(){const st=state.staff||{};return `<section class="panel"><h2>⚡ Business upgrades</h2><p class="muted">Hire help to spend less time on routine work. Staff cost wages each trading day, so expand carefully.</p><div class="cards"><article class="card"><div class="art">🧑‍💼</div><h3>Sales assistant</h3><div class="price">£650</div><p class="muted">Automatically lists any unlisted stock at an attractive price when you end the day. £12/day wages.</p><button class="green" ${st.lister||state.cash<650?'disabled':''} onclick="hire('lister')">${st.lister?'Hired ✓':'Hire assistant'}</button></article><article class="card"><div class="art">🧑‍🔧</div><h3>Workshop mechanic</h3><div class="price">£1,100</div><p class="muted">Reduces all future preparation and repair costs by 40%. £18/day wages.</p><button class="green" ${st.mechanic||state.cash<1100?'disabled':''} onclick="hire('mechanic')">${st.mechanic?'Hired ✓':'Hire mechanic'}</button></article></div><p class="muted">Staff wages per day: ${cashfmt((st.lister?12:0)+(st.mechanic?18:0))}</p></section>`}
let tutorialStep=-1;
const tutorialSlides=[
 ['🛒','Find your first bargain','You start with £100. Visit the Market and buy a cheap used part. Check the price, estimated resale value and available storage.'],
 ['📦','Put it up for sale','Buying something does NOT automatically sell it! Open Stock, choose an asking price, and press the green List for sale button.'],
 ['💚','Balance profit and appeal','A lower price attracts more customers but earns less profit. Watch the Customer Appeal bar when you change your price.'],
 ['📅','Wait for a buyer','Press End day to receive potential offers. Return to Stock to accept an offer, or wait for a better one.'],
 ['🏢','Build your empire','Reinvest profits, try auctions, advertise your listings and buy bigger properties. Eventually you can start flipping cars!']
];
function openTutorial(){tutorialStep=0;render()}
function closeTutorial(){tutorialStep=-1;try{localStorage.setItem('tradingEmpireTutorialSeenV1','yes')}catch(e){}render()}
function tutorialNext(){if(tutorialStep>=tutorialSlides.length-1){closeTutorial();tab='market';render()}else{tutorialStep++;render()}}
function tutorialMarkup(){if(tutorialStep<0)return '';const x=tutorialSlides[tutorialStep];return `<div class="walkshade"><div class="walkbox" role="dialog" aria-modal="true" aria-label="Quick start tutorial"><div class="row"><b>QUICK START</b><button class="mini helpbtn" onclick="closeTutorial()">Skip ✕</button></div><div class="bigicon">${x[0]}</div><div class="dots">${tutorialStep+1} of ${tutorialSlides.length}</div><h2>${x[1]}</h2><p>${x[2]}</p><div class="walkbuttons">${tutorialStep>0?'<button class="outline" onclick="tutorialStep--;render()">Back</button>':''}<button class="green" onclick="tutorialNext()">${tutorialStep===tutorialSlides.length-1?'Start trading →':'Next →'}</button></div></div></div>`}
function guide(){const pending=state.inventory.filter(x=>x.offer).length,unlisted=state.inventory.filter(x=>!x.listed).length,listed=state.inventory.filter(x=>x.listed).length;let title,desc,target,label;if(pending){title='You have a buyer offer!';desc='Open Stock to accept or decline the offer and collect your money.';target='inventory';label='View buyer offers →'}else if(unlisted){title='Your stock needs listing';desc=`You have ${unlisted} item(s) not for sale yet. Open Stock, choose a price and tap List for sale.`;target='inventory';label='List my items →'}else if(listed){title='Your items are for sale';desc='Your listings are live. End the day to see if customers make offers. You can also promote your stock.';target='next';label='End day →'}else{title='Find your first bargain';desc='You have £'+Math.round(state.cash)+' to start. Buy a cheap part in the Market, then list it for sale from Stock.';target='market';label='Browse bargains →'}return `<section class="guide"><div class="row"><h2>✨ Your next step</h2><button class="mini helpbtn" onclick="openTutorial()">? How to play</button></div><b>${title}</b><p>${desc}</p><button class="green" onclick="${target==='next'?'nextDay()':`switchTab('${target}')`}">${label}</button></section>`}
function switchTab(t){tab=t;message='';render()}
function setCategory(c){selectedCategory=c;render()}
function itemCard(x,source){fixLegacyCar(x);const cond=['Needs repair','Used / fair','Good condition'][x.condition];const auction=source==='auction';const owned=source==='inventory';return `<article class="card"><div class="art">${x.icon||'🚗'}</div><h3>${x.year?x.year+' ':''}${x.name}</h3><span class="tag">${x.kind==='car'?'Vehicle':'Used part'}</span> <span class="tag">${cond}</span>${x.miles?`<p class="muted">${x.miles.toLocaleString()} miles</p>`:''}<p class="muted">Storage: ${x.space} · Estimated value: ${cashfmt(x.retail)}</p>${!owned?`<div class="row" style="margin-top:10px"><b>Product appeal</b><span>${appeal(x)}/100</span></div><div class="meter"><div style="width:${appeal(x)}%"></div></div><p class="muted">${appeal(x)>=75?'High demand':appeal(x)>=45?'Steady demand':'Niche item'} · Potential resale margin ${cashfmt(x.retail-x.cost)}</p>`:''}${owned?`<div class="price">Paid ${cashfmt(x.cost)}</div><div class="muted">${x.listed?'Listed for '+cashfmt(x.ask):'Not listed for sale'}</div>${`<div class="row"><b>Customer appeal</b><span>${appeal(x)}/100</span></div><div class="meter"><div style="width:${appeal(x)}%"></div></div><p class="muted">${appeal(x)>75?'Popular price · likely to sell quickly':appeal(x)>45?'Fair interest · may take a few days':'Expensive listing · slower sales'} · Potential profit ${cashfmt((x.ask||x.retail)-x.cost-(x.prepSpent||0))}</p>`}${x.offer?`<div class="notice">Buyer offers <b>${cashfmt(x.offer)}</b></div><div class="actions"><button class="green" onclick="accept(${x.id})">Accept offer</button><button class="outline" onclick="reject(${x.id})">Decline</button></div>`:''}<div class="actions">${x.condition<2?`<button class="orange" onclick="repair(${x.id})">Prepare ${cashfmt(x.repair||Math.round(x.retail*.08))}</button>`:''}</div><p class="muted" id="appeal${x.id}">Change the price to preview demand and profit.</p><div class="fields"><input id="ask${x.id}" oninput="previewAppeal(${x.id},this.value)" type="number" min="1" value="${x.ask||Math.round(x.retail*(x.condition===0?.65:x.condition===1?.85:1))}" aria-label="Asking price"><button class="green" onclick="list(${x.id})">${x.listed?'Update price':'List for sale'}</button></div>`:`<div class="price">${cashfmt(x.cost+(auction?Math.max(5,Math.round(x.cost*.12))*x.bids:0))}</div><div class="actions"><button class="${auction?'orange':'green'}" onclick="buy(${x.id},${auction})">${auction?'Bid / buy':'Buy now'}</button></div>${auction?`<p class="muted">${x.bids?'Rival bids: '+x.bids:'Auction lot · Rival bidding possible'}</p>`:''}`}</article>`}
function home(){const offerCount=state.inventory.filter(x=>x.offer).length;return `<section class="hero"><div style="min-height:170px;background:linear-gradient(135deg,#28526e,#112b42);display:flex;align-items:center;justify-content:center;font-size:65px">🛞 🔧 🚗</div><div class="heroText"><h1>From £100 to an automotive empire</h1><p>${PROPS[state.property][0]} · ${state.inventory.length} items in stock · ${offerCount} buyer offers</p></div></section>${guide()}${!state.starterClaimed?`<section class="panel" style="background:linear-gradient(110deg,#234d42,#1a3448)"><h2>🎁 Your first bargain</h2><p>Someone nearby is clearing their garage. A tool kit worth around £75 is yours for £20. Great for your first flip!</p><button class="green" onclick="starterFind()">Buy tool kit · £20</button></section>`:""}<div class="quick"><button class="green" onclick="switchTab('market')">🛒 Marketplace</button><button class="orange" onclick="switchTab('auction')">🔨 Auctions</button><button class="purple" onclick="switchTab('inventory')">📦 Inventory</button><button class="red" onclick="nextDay()">⏭ Next day</button></div><div class="two"><section class="panel"><h2>Business progress</h2><div class="muted">Goal: £1,000,000 net worth</div><div class="meter"><div style="width:${Math.min(100,worth()/10000)}%"></div></div><div class="row"><b>${cashfmt(worth())}</b><span class="muted">${(worth()/10000).toFixed(2)}%</span></div><p class="muted">Parts trader → Garage owner → Car trader → Dealership empire</p></section><section class="panel"><h2>Current property</h2><b>${PROPS[state.property][0]}</b><div class="meter"><div style="width:${Math.min(100,100*used()/PROPS[state.property][2])}%"></div></div><div class="row"><span>Storage ${used()}/${PROPS[state.property][2]}</span><span>Cars ${carCount()}/${PROPS[state.property][3]}</span></div><div class="actions"><button onclick="switchTab('property')">Upgrade property</button></div></section></div><section class="panel"><h2>Recent activity</h2><div class="log">${state.log.map(x=>'<div>• '+x+'</div>').join('')}</div></section>`}
function market(){return `<section class="panel"><h2>Community Marketplace</h2><p class="muted">Find bargain parts and used cars at fixed asking prices. Stock changes each day.</p><div class="fields" style="margin:12px 0">${['all','part','car'].map(c=>`<button class="${selectedCategory===c?'':'outline'} mini" onclick="setCategory('${c}')">${c==='all'?'All listings':c==='part'?'Parts':'Cars'}</button>`).join('')}</div><div class="cards">${state.market.filter(x=>selectedCategory==='all'||x.kind===selectedCategory).map(x=>itemCard(x,'market')).join('')||'<p class="empty">No listings in this category today.</p>'}</div></section>`}
function auctions(){return `<section class="panel"><h2>🔨 Auction House</h2><p class="muted">Lower opening bids, but competitors may bid against you. Each rival bid raises the price by £150. New lots appear each day.</p><div class="cards">${state.auctions.map(x=>itemCard(x,'auction')).join('')||'<p class="empty">Auction cleared. Advance the day.</p>'}</div></section>`}
function inventory(){return `<section class="panel"><h2>📦 My Inventory</h2><p class="muted">Tip: Try listing close to estimated value. A lower price improves customer appeal and sells faster. Use Marketing to attract more buyers.</p><div class="cards">${state.inventory.map(x=>itemCard(x,'inventory')).join('')||'<p class="empty">Your shelves are empty. Buy your first item in the Marketplace.</p>'}</div></section>`}
function property(){const next=PROPS[state.property+1];return `<section class="panel"><h2>🏠 Property & Expansion</h2><p class="muted">Each property increases storage and eventually adds parking for car trading. Property upgrades are permanent.</p><div class="card"><h3>Current: ${PROPS[state.property][0]}</h3><p>Storage: ${used()} / ${PROPS[state.property][2]}</p><p>Vehicle bays: ${carCount()} / ${PROPS[state.property][3]}</p><p>Daily running costs: ${cashfmt(PROPS[state.property][4])}</p></div>${next?`<div class="card" style="margin-top:12px"><span class="tag">NEXT UPGRADE</span><h3>${next[0]}</h3><div class="price">${cashfmt(next[1])}</div><p>Storage: ${next[2]} spaces · Car bays: ${next[3]}</p><p>Daily costs: ${cashfmt(next[4])}</p><button class="green" ${state.cash<next[1]?'disabled':''} onclick="upgrade()">Buy property</button></div>`:'<p>Maximum property unlocked!</p>'}<p class="muted">Progression tip: Start with small used parts, move to wheel sets, then unlock a garage and start buying cars.</p></section>`}
function render(){const root=document.getElementById('app');root.innerHTML=`<header class="top"><div class="brand">👑 TRADING EMPIRE <span>AUTOMOTIVE</span></div><div class="stats"><div class="pill"><small>DAY</small>${state.day}</div><div class="pill"><small>CASH</small>${cashfmt(state.cash)}</div><div class="pill"><small>NET WORTH</small>${cashfmt(worth())}</div><div class="pill"><small>SALES</small>${state.sold}</div></div></header><div class="storage-hud ${used()>=PROPS[state.property][2]?'full':''}"><div class="storage-hud-main"><div class="storage-hud-title"><span>📦 Storage</span><span>${used()} / ${PROPS[state.property][2]} spaces · ${Math.round(used()/PROPS[state.property][2]*100)}%</span></div><div class="storage-hud-track"><div class="storage-hud-fill" style="width:${Math.min(100,100*used()/PROPS[state.property][2])}%"></div></div></div><button class="storage-hud-action" onclick="switchTab('property')">Upgrade ↗</button></div><div class="layout"><nav class="nav">${[['home','🏠 Home'],['market','🛒 Market'],['auction','🔨 Auctions'],['inventory','📦 Stock'],['property','🏢 Property'],['marketing','📣 Promote'],['upgrades','⚡ Upgrades']].map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="switchTab('${id}')">${label}</button>`).join('')}</nav><main class="content"><div class="row" style="justify-content:flex-end"><button class="mini helpbtn" onclick="openTutorial()">❔ How to play</button></div>${message?`<div class="notice ${message.startsWith('ERROR')?'bad':''}">${message}</div>`:''}${tab==='home'?home():tab==='market'?market():tab==='auction'?auctions():tab==='inventory'?inventory():tab==='property'?property():tab==='upgrades'?upgrades():marketing()}<div class="row section"><button class="red" onclick="nextDay()">End day →</button><button class="outline mini" onclick="if(confirm('Start a new game? Your current save will be erased.')){initial();tab='home';message='';render()}">New game</button></div><div class="footer">Trading Empire: Automotive · Alpha 3.0 · Auto-saves locally in this browser · Offline playable</div></main></div>${tutorialMarkup()}` }
load();try{if(!localStorage.getItem('tradingEmpireTutorialSeenV1'))tutorialStep=0}catch(e){tutorialStep=0}render();
</script></body></html>
