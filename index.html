window.addEventListener("error",function(e){document.getElementById("app").innerHTML="<div style=\"padding:28px;color:white;font-family:system-ui\"><h2>Game could not start</h2><p>"+String(e.message).replace(/</g,"&lt;")+"</p><p>Try opening this as a hosted website in Safari.</p></div>"});
const ART='';
const TYPES=[['Used car stereo',18,52,1,'📻'],['Headlight pair',30,85,2,'💡'],['Tool bundle',25,75,2,'🧰'],['Alloy wheel',35,85,3,'🛞'],['Roof rack',40,105,3,'🚙'],['Used alternator',55,125,3,'🔩'],['Set of alloy wheels',120,285,8,'🛞'],['Turbocharger',180,410,4,'🌀'],['Gearbox',250,560,10,'⚙️'],['Engine',440,950,14,'🔧'],['Performance wheel set',850,1800,9,'🏁'],['Rare engine',1900,4100,15,'⚙️'],['Collector wheel set',3900,8000,10,'🛞'],['Race engine',8200,17500,18,'🏎️']];
const CAR_TYPES=[['Kestrel City',2008,750,'🚗'],['Valken Sprint',2012,1450,'🚙'],['Bavaro 320R',2005,2200,'🚘'],['Kestrel GT',2009,3700,'🏎️'],['Velora Roadster',2006,5800,'🏎️'],['Bavaro Classic',1992,11000,'🚘'],['Valken RS',2018,21000,'🚗'],['Velora Grand Tourer',2017,39000,'🏎️'],['Aurelio GT-R',2021,82000,'🏎️'],['Solstice V12',2023,180000,'🏎️'],['Aurelio Hyper GT',2025,440000,'🏎️']];
const PROPS=[['Bedroom shelves',0,5,0,0],['Garden shed',400,20,0,0],['Home garage',1800,55,1,5],['Small workshop',6500,130,3,20],['Car forecourt',25000,350,9,65],['Large dealership',110000,1200,30,200],['Luxury showroom',450000,3500,65,650]];
const cashfmt=n=>'$'+Math.round(n).toLocaleString('en-US');let state,tab='home',message='',selectedCategory='all',activeAuction=null;

let tutorialStep=-1;
const tutorialSlides=[
 ['🏠','Welcome to Trading Empire','You begin with $100 and a small parts shelf. Your goal is to buy bargains, prepare them if needed, then sell them for profit. '],
 ['🧰','Make your first deal','On Home, grab the $20 starter tool kit, or browse the Market after it opens at 08:00. Watch storage space and compare purchase price with estimated value.'],
 ['📦','List your stock','Open Inventory. Preparation improves damaged items but costs money, which counts towards your total investment. Choose a price and press List for sale.'],
 ['📈','Appeal speeds up buyers','Customer Appeal runs from 5 to 100. Higher appeal makes the buyer progress bar fill faster. Each full bar is a chance of an offer, not a guaranteed sale. Your first few sales have a gentle helping hand while you learn the ropes.'],

];

const BIDDER_NAMES=['Mason Motors','Northside Autos','Redline Traders','Harbour Cars','Parkway Sales','Elite Vehicle Co'];
const BUYER_TIERS=[{name:'No specialist',price:0,wage:0,spread:.53},{name:'Junior buyer',price:650,wage:8,spread:.32},{name:'Experienced buyer',price:2800,wage:24,spread:.16},{name:'Master buyer',price:11000,wage:65,spread:.055}];
const INSPECT_TIERS=[{name:'No inspector',price:0,wage:0,spread:.55},{name:'Junior inspector',price:1500,wage:12,spread:.35},{name:'Senior inspector',price:6000,wage:35,spread:.18},{name:'Master appraiser',price:20000,wage:85,spread:.07}];
const FAULTS=[['Runs well',0,2,'Sounds healthy enough to me.','Starts and drives normally.'],['Minor service needed',.055,1,'Might need a bit of attention, nothing obvious.','Some routine maintenance needed.'],['Worn suspension',.14,1,'There is a knock underneath. Could be suspension.','Suspension requires work.'],['Clutch slipping',.27,0,'Clutch feels a little tired. I would be careful.','Clutch replacement required.'],['Gearbox trouble',.43,0,'That gearbox does not sound happy.','Gearbox has a serious fault.'],['Head gasket failure',.64,0,'I do not like that exhaust smoke or the cooling system.','Blown head gasket. Major engine work needed.']];
function truth(x){return Math.max(5,Math.round(x.trueValue||x.retail||100))}
function pricing(x){const v=truth(x),ratio=x.cost/v;return ratio<.72?'Steal':ratio<.96?'Fairly priced':ratio<1.12?'Retail price':'Expensive'}
function valuation(x,tier,auction=false){const cfg=(auction?INSPECT_TIERS:BUYER_TIERS)[tier]||BUYER_TIERS[0];const v=truth(x);const drift=((x.id*37%17)-8)/8*cfg.spread*.26;const mid=v*(1+drift);return [Math.max(1,Math.round(mid*(1-cfg.spread)/10)*10),Math.round(mid*(1+cfg.spread)/10)*10]}
function valueText(x,auction=false){const tier=auction?(state.inspectorTier||0):(state.buyerTier||0),r=valuation(x,tier,auction);return cashfmt(r[0])+'–'+cashfmt(r[1])}
function inspectHint(x){const tier=state.inspectorTier||0;if(!tier)return 'No mechanical assessment available. The true condition is unknown.';const f=FAULTS[x.faultIndex??0];if(tier===1)return x.faultIndex>=3?'Something sounds off. I would not bid too high.':x.faultIndex>=1?'A few things might need attention.':'Seems alright from a distance.';if(tier===2)return x.faultIndex>=2?f[3]:f[3];return f[2]+' Likely fault: '+f[0]+'.';}
function buyerHint(x){if((state.buyerTier||0)<3)return '';const c=pricing(x);return c==='Steal'?'Likely bargain':c==='Fairly priced'?'Fair asking price':c==='Retail price'?'Around retail value':'Looks overpriced'}
function ensureRisk(x){if(x.kind!=='car')return;x.trueValue??=x.retail;if(x.faultIndex===undefined){x.faultIndex=x.condition===0?3:x.condition===1?1:0;x.undisclosed=true;}x.healthyValue??=Math.round(x.trueValue/(1-(FAULTS[x.faultIndex]?.[1]||0)));x.repair??=Math.round(x.healthyValue*(FAULTS[x.faultIndex]?.[1]||0));}
function revealCar(x){ensureRisk(x);x.retail=truth(x);x.condition=FAULTS[x.faultIndex][2];x.repair=Math.max(0,Math.round(x.healthyValue-x.trueValue));x.revealed=true;}
function rollCarRisk(x){const r=rand();x.faultIndex=r<.32?0:r<.52?1:r<.7?2:r<.82?3:r<.93?4:5;const f=FAULTS[x.faultIndex];x.healthyValue=x.retail;x.trueValue=Math.max(100,Math.round(x.healthyValue*(1-f[1])));x.condition=f[2];x.repair=Math.max(0,x.healthyValue-x.trueValue);x.revealed=false;return x}
function marketPrice(x){const r=rand();const factor=r<.15?.40+rand()*.3:r<.55?.75+rand()*.2:r<.85?.96+rand()*.15:1.16+rand()*.34;x.cost=Math.max(5,Math.round(truth(x)*factor));return x}
function staffWages(){return (state.staff.lister?12:0)+(state.staff.mechanic?18:0)+BUYER_TIERS[state.buyerTier||0].wage+INSPECT_TIERS[state.inspectorTier||0].wage+[0,10,38][state.marketingStaff||0]}
function hireTier(type){const key=type==='buyer'?'buyerTier':'inspectorTier',tiers=type==='buyer'?BUYER_TIERS:INSPECT_TIERS;const next=(state[key]||0)+1;if(next>=tiers.length)return;const cost=tiers[next].price;if(state.cash<cost)return notify('Not enough cash to hire '+tiers[next].name+'.',true);state.cash-=cost;state[key]=next;log('Hired '+tiers[next].name);save();notify(tiers[next].name+' joined your team. Previous employee replaced.');}
function staffPage(){const make=(type,tiers)=>{const tier=state[type==='buyer'?'buyerTier':'inspectorTier']||0;return `<article class="card"><div class="art">${type==='buyer'?'🧑‍💼':'🧑‍🔧'}</div><h3>${type==='buyer'?'Marketplace buyer':'Auction inspector'}</h3><span class="tag">Current: ${tiers[tier].name}</span><p class="muted">${type==='buyer'?'Improves estimated resale price ranges on all 15 marketplace listings. Master identifies bargains.':'Narrows auction car valuations and offers increasingly specific warnings about hidden faults.'}</p>${tier<3?`<h3>Next: ${tiers[tier+1].name}</h3><div class="price">${cashfmt(tiers[tier+1].price)}</div><p class="muted">Replaces current specialist · ${cashfmt(tiers[tier+1].wage)}/day wage</p><button class="green" ${state.cash<tiers[tier+1].price?'disabled':''} onclick="hireTier('${type}')">Hire next level</button>`:'<p class="notice">Top level unlocked</p>'}</article>`};return `<section class="panel"><h2>👥 Your staff</h2><p class="muted">Staff give you better information. You still choose what to buy, bid on, repair and sell. Hiring the next level replaces the previous specialist.</p><div class="cards">${make('buyer',BUYER_TIERS)}${make('inspector',INSPECT_TIERS)}<article class="card"><div class="art">🧑‍💼</div><h3>Sales assistant</h3><p class="muted">Automatically lists new stock. Choose a price target; you still approve buyer offers.</p>${state.staff.lister?`<label class="muted" for="lister-markup">Automatic asking price</label><select id="lister-markup" onchange="setListerMarkup(this.value)">${[[-15,'Quick sale (-15%)'],[-10,'Fast sale (-10%)'],[0,'Estimated price'],[10,'Estimate +10%'],[20,'Estimate +20%']].map(([v,t])=>`<option value="${v}" ${state.listerMarkup===v?'selected':''}>${t}</option>`).join('')}</select>`:''}<div class="price">$650</div><button class="green" ${state.staff.lister||state.cash<650?'disabled':''} onclick="hire('lister')">${state.staff.lister?'Hired':'Hire'}</button></article><article class="card"><div class="art">🔧</div><h3>Workshop mechanic</h3><p class="muted">Cuts preparation costs by 40%.</p><div class="price">$1,100</div><button class="green" ${state.staff.mechanic||state.cash<1100?'disabled':''} onclick="hire('mechanic')">${state.staff.mechanic?'Hired':'Hire'}</button></article></div><p class="muted">Total daily wages: ${cashfmt(staffWages())}</p></section>`}

function rand(){state.seed=(Math.imul(state.seed,1664525)+1013904223)>>>0;return state.seed/4294967296}
function newLot(type,auction=false){const affordable=TYPES.filter(t=>t[1]<=Math.max(65,state.cash*1.8+state.revenue*.12));const pool=affordable.length?affordable:TYPES.slice(0,5);const t=pool[Math.floor(rand()*pool.length)];const condition=Math.floor(rand()*3);const base=Math.max(5,Math.round(t[1]*(.65+rand()*.55)));return{id:state.nextId++,kind:'part',name:t[0],icon:t[4],cost:base,retail:Math.round(t[2]*(.85+rand()*.35)),space:t[3],condition,repair:condition===0?Math.round(t[1]*.23):0,listed:false,ask:0,auction,days:0}}
function newCar(auction=false){const eligible=CAR_TYPES.filter(t=>t[2]<=Math.max(2500,state.cash*2+state.revenue*.15));const t=eligible[Math.floor(rand()*eligible.length)];const condition=Math.floor(rand()*3);const retail=Math.round(t[2]*(.85+rand()*.35));return{id:state.nextId++,kind:'car',name:t[0],year:t[1],icon:t[3],miles:Math.round((30+rand()*160))*1000,cost:Math.round(retail*(.48+rand()*.24)),retail,space:15,condition,repair:condition===0?Math.round(retail*.24):condition===1?Math.round(retail*.08):0,listed:false,ask:0,auction,days:0}}
function fixLegacyCar(x){if(x.kind==='car'){const old={'Ford Fiesta':'Kestrel City','Vauxhall Corsa':'Valken Sprint','BMW E46 320d':'Bavaro 320R','VW Golf GTI':'Kestrel GT','Mazda MX-5':'Velora Roadster','BMW E30':'Bavaro Classic','Porsche Boxster':'Velora Roadster','Range Rover':'Valken RS'};x.name=old[x.name]||x.name;const t=CAR_TYPES.find(t=>t[0]===x.name)||CAR_TYPES[0];if(!x.icon||x.icon==='undefined')x.icon=t[3];if(!Number.isFinite(x.retail)||x.retail<100)x.retail=t[2];if(!Number.isFinite(x.cost)||x.cost<1)x.cost=Math.round(x.retail*.6)}return x}
function refill(){const carSlots=state.day>2?Math.floor(rand()*4):0;state.market=Array.from({length:15-carSlots},()=>marketPrice(newLot()));state.market.push(...Array.from({length:carSlots},()=>marketPrice(rollCarRisk(newCar()))));state.market.sort(()=>rand()-.5);state.auctions=Array.from({length:6},()=>rollCarRisk(newCar(true)));state.auctions.forEach(x=>{x.cost=Math.max(50,Math.round(x.healthyValue*(.05+rand()*.08)));x.rival=Math.round(x.healthyValue*(.28+rand()*.88));x.bids=0})}

const SAVE_PREFIX='tradingEmpireAutomotiveV1';
function activeSlot(){return Math.max(1,Math.min(3,Number(localStorage.getItem('tradingEmpireActiveSlot')||1)))}
function activeSaveKey(){return activeSlot()===1?SAVE_PREFIX:SAVE_PREFIX+'_slot'+activeSlot()}
function slotName(n){return localStorage.getItem('tradingEmpireSlotName'+n)||('Save '+n)}
function switchSave(n){n=Number(n);if(n===activeSlot())return;if(!confirm('Switch to '+slotName(n)+'? Your current progress is saved.'))return;save();localStorage.setItem('tradingEmpireActiveSlot',String(n));activeAuction=null;message='';tab='home';load();tutorialStep=state.tutorialCompleted===false?0:-1;render();openingToast('Loaded '+slotName(n))}
function renameSave(){const n=activeSlot();const v=prompt('Name this save file:',slotName(n));if(v===null)return;localStorage.setItem('tradingEmpireSlotName'+n,v.trim().slice(0,26)||('Save '+n));render()}
function newSave(){const n=Number(document.getElementById('save-select')?.value||activeSlot());if(!confirm('Start a new game in '+slotName(n)+'? This will overwrite ONLY that save slot.'))return;save();localStorage.setItem('tradingEmpireActiveSlot',String(n));initial();tab='home';message='';tutorialStep=0;render();openingToast('New game started in '+slotName(n))}
function saveManager(){return `<section class="panel"><h2>Save files</h2><p class="muted">Three independent local saves. Your original game is Save 1. Switching saves never deletes another slot.</p><div class="fields"><select id="save-select" onchange="switchSave(this.value)">${[1,2,3].map(n=>`<option value="${n}" ${n===activeSlot()?'selected':''}>${slotName(n)}${localStorage.getItem(n===1?SAVE_PREFIX:SAVE_PREFIX+'_slot'+n)?' · In use':' · Empty'}</option>`).join('')}</select></div><div class="actions"><button class="outline" onclick="renameSave()">Rename current save</button><button class="outline" onclick="newSave()">Start fresh in selected slot</button></div><p class="muted">Saves are stored on this device in this browser. Clearing Safari website data can erase them.</p></section>`}
function listerPrice(x){return Math.max(1,Math.round(x.retail*(x.condition===0?.68:x.condition===1?.84:.97)*(1+(state.listerMarkup||0)/100)))}
function autoListItem(x){if(!state.staff?.lister||x.listed)return; x.ask=listerPrice(x);x.listed=true;x.days=0;x.lastBuyerCheck=state.clockMinute??420;}
function setListerMarkup(value){state.listerMarkup=Number(value)||0;save();openingToast('Sales assistant target: '+(state.listerMarkup>0?'+':'')+state.listerMarkup+'%');render()}
function casinoWager(){const v=Number(document.getElementById('casino-wager')?.value||25);return Number.isFinite(v)?Math.floor(v):0}
function casinoStake(){const n=casinoWager();if(n<1||n>10000)return notify('Choose a stake between $1 and $10,000.',true);if(n>state.cash)return notify('Not enough game cash for that stake.',true);return n}
function casinoCard(){const r=Math.floor(rand()*13)+1;return {rank:r===1?'A':r===11?'J':r===12?'Q':r===13?'K':String(r),value:r===1?11:Math.min(r,10)}}
function casinoTotal(cards){let n=cards.reduce((v,c)=>v+c.value,0),aces=cards.filter(c=>c.rank==='A').length;while(n>21&&aces-- >0)n-=10;return n}
function casinoCards(cards,hide=false){return cards.map((c,i)=>`<span class="playing-card">${hide&&i===1?'?':c.rank}</span>`).join('')}
function casino(){const h=state.casinoHand;return `<section class="panel"><h2>Casino</h2><p class="muted">Just for fun. All stakes and winnings use your in-game business cash. No real money.</p><div class="casino-stake"><label for="casino-wager">Stake ($)</label><input id="casino-wager" type="number" min="1" max="10000" step="1" value="${Math.min(25,Math.max(1,state.cash))}" ${h?'disabled':''}></div><div class="actions">${[10,25,100,500].map(v=>`<button class="outline mini" onclick="document.getElementById('casino-wager').value=${v}" ${h?'disabled':''}>$${v}</button>`).join('')}</div></section><section class="panel"><h2>Blackjack</h2><p class="muted">Get closer to 21 than the dealer without going over. Blackjack pays 3:2; a draw returns your stake.</p>${h?`<div class="casino-table"><p>Dealer ${h.finished?'('+casinoTotal(h.dealer)+')':''}</p><div class="casino-hand">${casinoCards(h.dealer,!h.finished)}</div><p>Your hand (${casinoTotal(h.player)})</p><div class="casino-hand">${casinoCards(h.player)}</div><p><b>Stake: ${cashfmt(h.bet)}</b></p>${h.finished?`<p class="notice">${h.result}</p><button class="green" onclick="casinoClear()">New hand</button>`:`<div class="actions"><button class="green" onclick="blackjackHit()">Hit</button><button class="outline" onclick="blackjackStand()">Stand</button>${h.player.length===2&&state.cash>=h.bet?'<button class="outline" onclick="blackjackDouble()">Double</button>':''}</div>`}</div>`:`<button class="green" onclick="blackjackStart()">Deal cards</button>`}</section><section class="panel"><h2>Slots</h2><p class="muted">Three reels. Three matching symbols pay 5x–15x your stake; two matching symbols pay 1.5x. Each spin is independent.</p><div class="slot-reels">${(state.slotLast?.reels||['◆','7','★']).map(v=>`<span>${v}</span>`).join('')}</div>${state.slotLast?`<p class="muted">${state.slotLast.message}</p>`:''}<button class="green" onclick="casinoSpin()" ${h&&!h.finished?'disabled':''}>Spin slots</button></section>`}
function blackjackStart(){if(state.casinoHand&&!state.casinoHand.finished)return;const bet=casinoStake();if(!bet)return;state.cash-=bet;const h={bet,player:[casinoCard(),casinoCard()],dealer:[casinoCard(),casinoCard()],finished:false,result:''};state.casinoHand=h;if(casinoTotal(h.player)===21){if(casinoTotal(h.dealer)===21)blackjackFinish('Push - both have blackjack',1);else blackjackFinish('Blackjack! Paid 3:2',2.5)}else if(casinoTotal(h.dealer)===21)blackjackFinish('Dealer blackjack - you lose',0);save();render()}
function blackjackFinish(result,mult){const h=state.casinoHand;if(!h)return;h.finished=true;h.result=result;state.cash+=Math.floor(h.bet*mult);save();render()}
function blackjackHit(){const h=state.casinoHand;if(!h||h.finished)return;h.player.push(casinoCard());if(casinoTotal(h.player)>21)blackjackFinish('Bust - you lose',0);else if(casinoTotal(h.player)===21)blackjackStand();else{save();render()}}
function blackjackStand(){const h=state.casinoHand;if(!h||h.finished)return;while(casinoTotal(h.dealer)<17)h.dealer.push(casinoCard());const p=casinoTotal(h.player),d=casinoTotal(h.dealer);blackjackFinish(d>21||p>d?'You win!':p===d?'Push - stake returned':'Dealer wins',d>21||p>d?2:p===d?1:0)}
function blackjackDouble(){const h=state.casinoHand;if(!h||h.finished||h.player.length!==2||state.cash<h.bet)return;state.cash-=h.bet;h.bet*=2;h.player.push(casinoCard());if(casinoTotal(h.player)>21)blackjackFinish('Bust - you lose',0);else blackjackStand()}
function casinoClear(){state.casinoHand=null;save();render()}
function casinoSpin(){if(state.casinoHand&&!state.casinoHand.finished)return notify('Finish your blackjack hand first.',true);const bet=casinoStake();if(!bet)return;state.cash-=bet;const symbols=['◆','◆','●','●','★','7'];const reels=Array.from({length:3},()=>symbols[Math.floor(rand()*symbols.length)]);const counts=reels.map(x=>reels.filter(y=>x===y).length),triple=counts[0]===3,pair=counts.includes(2);const mult=triple?(reels[0]==='7'?15:reels[0]==='★'?10:5):pair?1.5:0;const win=Math.floor(bet*mult);state.cash+=win;state.slotLast={reels,message:win?'Won '+cashfmt(win)+' on a '+cashfmt(bet)+' spin.':'No match - lost '+cashfmt(bet)+'.'};save();render()}
function initial(){state={cash:100,day:1,property:0,inventory:[],market:[],auctions:[],revenue:0,profit:0,sold:0,seed:73127,nextId:1,log:['Opened your business with $100. Find a bargain and flip it!'],rep:50,marketing:0,marketingDays:0,freePostDay:0,staff:{lister:false,mechanic:false},listerMarkup:0,buyerTier:0,inspectorTier:0,starterClaimed:false,autoRepair:false,auctionContact:false,followers:0,brandLevel:0,photoLevel:0,marketingStaff:0,campaigns:[],targetedItem:0,viralPosts:0,clockMinute:420,tutorialCompleted:false,scrapFreeDay:0,scrapAttempts:0,scrapAttemptsToday:0};refill();save()}

function load(){try{const s=JSON.parse(localStorage.getItem(activeSaveKey()));if(s&&typeof s.cash==='number'&&Array.isArray(s.inventory)){state=s;state.marketing??=0;state.marketingDays??=0;state.freePostDay??=0;state.staff??={lister:false,mechanic:false};state.scrapFreeDay??=0;state.scrapAttempts??=0;state.scrapAttemptsToday??=0;state.scrapAttemptsDay??=state.day;state.listerMarkup??=0;state.buyerTier??=0;state.inspectorTier??=0;state.starterClaimed??=true;state.autoRepair??=false;state.auctionContact??=false;state.followers??=0;state.brandLevel??=0;state.photoLevel??=0;state.marketingStaff??=0;state.campaigns??=[];state.targetedItem??=0;state.viralPosts??=0;state.clockMinute??=420;state.auctions=(state.auctions||[]).filter(x=>x.kind==='car');state.inventory.forEach(fixLegacyCar);(state.market||[]).forEach(fixLegacyCar);state.auctions.forEach(fixLegacyCar);state.inventory.filter(x=>x.kind==='car').forEach(x=>{ensureRisk(x);x.revealed=true});if(state.market.length!==15||state.market.filter(x=>x.kind==='car').length>3)refill();else state.market.filter(x=>x.kind==='car').forEach(ensureRisk);state.auctions.forEach(ensureRisk);save();return}}catch(e){}initial()}

function save(){try{localStorage.setItem(activeSaveKey(),JSON.stringify(state))}catch(e){}}
function notify(s,err=false){message=(err?'ERROR: ':'')+s;render()}
function log(s){state.log.unshift('Day '+state.day+': '+s);state.log=state.log.slice(0,10)}
function used(){return state.inventory.reduce((s,x)=>s+(x.kind==='car'?0:x.space),0)}function carCount(){return state.inventory.filter(x=>x.kind==='car').length}
function worth(){return state.cash+PROPS[state.property][1]+state.inventory.reduce((s,x)=>s+x.retail*(x.condition===0?.55:x.condition===1?.8:1),0)}
function buy(id,auction=false){if(!auction&&!isOpen(8,20))return notify('Marketplace is closed. Open 08:00–20:00.',true);const source=auction?state.auctions:state.market;const x=source.find(x=>x.id===id);if(!x)return;const price=x.cost;if(state.cash<price)return notify('Not enough money.',true);if(x.kind!=='car'&&used()+x.space>PROPS[state.property][2])return notify('Not enough parts storage. Upgrade your property.',true);if(x.kind==='car'&&carCount()>=PROPS[state.property][3])return notify('No available car parking spaces.',true);state.cash-=price;source.splice(source.indexOf(x),1);const owned={...x,cost:price,listed:false,ask:0};if(owned.kind==='car')revealCar(owned);state.inventory.push(owned);state.starterClaimed=true;autoListItem(owned);log('Bought '+x.name+' for '+cashfmt(price));save();notify('Purchased '+x.name+' for '+cashfmt(price)+(owned.kind==='car'?'. Inspection: '+FAULTS[owned.faultIndex][3]+' Actual value '+cashfmt(owned.retail)+'.':''))}

function repair(id){const x=state.inventory.find(x=>x.id===id);if(!x||x.condition===2)return;const price=Math.max(1,Math.round((x.repair||x.retail*.08)*(state.staff.mechanic?.6:1)));if(state.cash<price)return notify('Not enough money for preparation.',true);state.cash-=price;x.prepSpent=(x.prepSpent||0)+price;x.condition=2;x.repair=0;x.listed=false;x.ask=Math.max(x.ask||0,x.cost+x.prepSpent);log('Prepared '+x.name+' for '+cashfmt(price));save();notify('Prepared for '+cashfmt(price)+'. Total invested: '+cashfmt(x.cost+x.prepSpent)+'.')}
function priceBounds(x){const basis=Math.max(1,x.cost+(x.prepSpent||0));const down=x.kind==='car'?.15:basis<100?.25:.20;const up=x.kind==='car'?.75:basis<100?2:basis<500?1.5:1;return {basis,min:Math.max(1,Math.round(basis*(1-down))),max:Math.max(2,Math.round(basis*(1+up))),down:Math.round(down*100),up:Math.round(up*100)}}
function priceSliderStyle(x,price){const b=priceBounds(x);const zero=(b.basis-b.min)/(b.max-b.min)*100;const current=Math.max(0,Math.min(100,(price-b.min)/(b.max-b.min)*100));return `background:linear-gradient(to right,#e65b60 0%,#e65b60 ${zero}%,#229e78 ${zero}%,#229e78 100%);--price-progress:${current}%`}
function previewAppeal(id,val){const x=state.inventory.find(x=>x.id===id);if(!x)return;const bounds=priceBounds(x);const price=Math.max(bounds.min,Math.min(bounds.max,Math.round(Number(val))));if(!Number.isFinite(price))return;const a=appeal({...x,ask:price});const priceEl=document.getElementById('ask'+id),range=document.getElementById('askrange'+id),appealEl=document.getElementById('appeal'+id),score=document.getElementById('appealscore'+id),fill=document.getElementById('appealfill'+id),profit=document.getElementById('profit'+id),delta=document.getElementById('pricedelta'+id);if(priceEl)priceEl.value=price;if(range){range.value=price;range.style.cssText=priceSliderStyle(x,price)}const gain=price-bounds.basis;if(appealEl)appealEl.textContent='Potential '+(gain<0?'loss ':'profit ')+cashfmt(Math.abs(gain));if(score)score.textContent=a+'/100';if(fill)fill.style.width=a+'%';if(profit){profit.textContent=(gain<0?'-':'')+cashfmt(Math.abs(gain));profit.style.color=gain<0?'#ff8589':''}if(delta){delta.textContent=(gain<0?'Loss ':'Profit ')+(gain<0?'-':'')+cashfmt(Math.abs(gain));delta.style.color=gain<0?'#ff8589':'#6ce4b2'}}
function list(id){const x=state.inventory.find(x=>x.id===id);if(!x)return;const input=document.getElementById('ask'+id);const price=Math.round(Number(input?.value));if(!Number.isFinite(price)||price<priceBounds(x).min||price>priceBounds(x).max)return notify('Price must be within 75% of total invested.',true);x.ask=price;x.listed=true;x.days=0;x.lastBuyerCheck=Math.max(480,state.clockMinute);log('Listed '+x.name+' for '+cashfmt(price));save();notify('Listing published. Buyers can make offers during business hours.')}
function accept(id){const x=state.inventory.find(x=>x.id===id);if(!x||!x.offer)return;const amount=x.offer;state.cash+=amount;state.revenue+=amount;state.profit+=amount-x.cost-(x.prepSpent||0);state.sold++;state.rep=Math.min(100,state.rep+1);state.followers=(state.followers||0)+Math.max(1,Math.round(2+rand()*8));state.inventory.splice(state.inventory.indexOf(x),1);log('Sold '+x.name+' for '+cashfmt(amount));save();notify('Sold for '+cashfmt(amount)+'!')}
function reject(id){const x=state.inventory.find(x=>x.id===id);if(x){x.offer=0;log('Declined an offer on '+x.name)}save();render()}
function upgrade(){const p=PROPS[state.property+1];if(!p)return;if(state.cash<p[1])return notify('Not enough cash.',true);state.cash-=p[1];state.property++;log('Moved into '+p[0]);save();notify('Property upgraded! You now have '+p[2]+' storage spaces.')}
function nextDay(){
if(tutorialStep>=0)return;
if(window.sleepTransition)return;
window.sleepTransition=true;
const overlay=document.createElement('div');overlay.className='sleep-overlay';overlay.innerHTML='<div class="sleep-face"><div class="sleep-clock">◷</div><div class="sleep-caption">Closing for the night</div><div class="sleep-time">00:00 → 07:00</div></div>';document.body.appendChild(overlay);
requestAnimationFrame(()=>overlay.classList.add('sleeping'));
setTimeout(()=>{activeAuction=null;state.day++;state.clockMinute=420;state.scrapAttemptsToday=0;state.scrapAttemptsDay=state.day;state.marketingDays=Math.max(0,state.marketingDays-1);state.campaigns=(state.campaigns||[]).filter(c=>c.until>=state.day);const wages=staffWages();const rent=PROPS[state.property][4]+wages;state.cash-=rent;let autoFixed=0,repairBill=0;if(state.autoRepair){for(const x of state.inventory){if(x.condition===2)continue;const cost=Math.max(1,Math.round((x.repair||x.retail*.08)*(state.staff.mechanic?.6:1)));if(state.cash<cost)continue;state.cash-=cost;x.prepSpent=(x.prepSpent||0)+cost;x.condition=2;x.repair=0;repairBill+=cost;autoFixed++;}}for(const x of state.inventory){if(state.staff.lister&&!x.listed)autoListItem(x);if(x.listed)x.days=(x.days||0)+1;}refill();log('New day started at 07:00. Overheads '+cashfmt(rent)+(autoFixed?'; prepared '+autoFixed+' items for '+cashfmt(repairBill):''));save();message='Day '+state.day+' · 07:00. A new trading day begins.';render();overlay.querySelector('.sleep-caption').textContent='Day '+state.day+' · Good morning';overlay.querySelector('.sleep-time').textContent='07:00';overlay.classList.add('waking');setTimeout(()=>{overlay.remove();window.sleepTransition=false},550)},850)
}
function clockText(){const m=Math.min(1440,Math.max(420,state.clockMinute??420));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function isOpen(open,close){return (state.clockMinute??420)>=open*60&&(state.clockMinute??420)<close*60}
function openingNote(open,close){return isOpen(open,close)?'<span class="open-status">OPEN</span>':'<span class="closed-status">CLOSED · '+String(open).padStart(2,'0')+':00–'+String(close).padStart(2,'0')+':00</span>'}
function openingToast(text){
let host=document.getElementById('opening-toast');
if(!host){host=document.createElement('div');host.id='opening-toast';host.setAttribute('role','status');host.setAttribute('aria-live','polite');document.body.appendChild(host)}
host.textContent=text;host.classList.remove('visible');void host.offsetWidth;host.classList.add('visible');
clearTimeout(window.openingToastTimer);window.openingToastTimer=setTimeout(()=>host.classList.remove('visible'),2600);
}
function timeTick(){if(tutorialStep>=0||window.sleepTransition||!state||!Number.isFinite(state.clockMinute)||state.clockMinute>=1440)return;state.clockMinute=Math.min(1440,state.clockMinute+1);
const hourEvents={480:'Marketplace is now open',600:'Auction house is now open',1140:'Auction house has closed',1200:'Marketplace has closed',1440:'Midnight - day complete'};
if(hourEvents[state.clockMinute])openingToast(hourEvents[state.clockMinute]);
let offers=0;
if(isOpen(8,21))for(const x of state.inventory){
 if(!x.listed||x.offer)continue;
 x.lastBuyerCheck??=state.clockMinute;
 const duration=buyerCycleMinutes(x);
 if(state.clockMinute-x.lastBuyerCheck>=duration){
   x.lastBuyerCheck=state.clockMinute;
   const beginnerBoost=1+Math.max(0,10-(state.sold||0))*.055;
   const chance=Math.min(.68,Math.max(.06,(appeal(x)/100)*.34*marketingBoost(x)*beginnerBoost));
   if(rand()<chance){x.offer=Math.max(1,Math.round(Math.min(x.ask,x.retail*(.78+rand()*.23))));offers++;}
 }
}
if(offers){log(offers+' new buyer offer(s) at '+clockText());openingToast(offers+' new buyer offer'+(offers>1?'s':'')+' received');}
if(state.clockMinute%15===0||offers||state.clockMinute===1440)save();
const clock=document.getElementById('game-clock');if(clock)clock.textContent=clockText();document.querySelectorAll('.buyer-fill').forEach(el=>{const x=state.inventory.find(v=>v.id===Number(el.dataset.item));if(x)el.style.width=buyerProgress(x)+'%'});
if(offers||state.clockMinute===1440)render();
}

function appeal(x){const ratio=(x.ask||x.retail)/Math.max(1,x.retail);const popular=['Tool bundle','Used car stereo','Alloy wheel','Headlight pair','Set of alloy wheels'];const base=x.kind==='car'?53:popular.includes(x.name)?78:58;return Math.max(5,Math.min(100,Math.round(base+(1-ratio)*95+(x.condition-1)*12+(state.rep-50)*.16)))}
function marketingBoost(x){let boost=1;const followers=state.followers||0;boost+=Math.min(.22,followers/20000);boost+=(state.brandLevel||0)*.035;boost+=(state.marketingStaff||0)*.035;if(state.freePostDay===state.day)boost*=1.15+(state.photoLevel||0)*.05;if(state.marketingDays>0)boost*=1.5;for(const c of state.campaigns||[]){if(c.until<state.day)continue;if(c.type==='local')boost*=1.35;if(c.type==='targeted'&&c.itemId===x.id)boost*=1.95;if(c.type==='regional')boost*=1.6;}return boost}
function saleChance(x){return Math.min(.94,Math.max(.02,appeal(x)/150*marketingBoost(x)))}
const CAMPAIGN_OPTIONS={local:{price:50,days:3,label:'Local advertising'},targeted:{price:200,days:4,label:'Featured stock campaign'},regional:{price:1000,days:7,label:'Regional advertising'}};
function campaign(type){if(type==='post'){if(state.freePostDay===state.day)return notify('Already posted today. Come back tomorrow.',true);state.freePostDay=state.day;const viral=rand()<(.06+.035*(state.photoLevel||0)+.025*(state.marketingStaff||0));const gained=Math.round((8+rand()*23)*(1+(state.photoLevel||0)*.65+(state.marketingStaff||0)*.4)*(viral?8:1));state.followers=(state.followers||0)+gained;if(viral)state.viralPosts=(state.viralPosts||0)+1;log('Posted on social media; gained '+gained+' followers'+(viral?' (viral post!)':''));save();return notify((viral?'Your post went viral! ':'Post published! ')+'Gained '+gained+' followers.')}const opt=CAMPAIGN_OPTIONS[type];if(!opt)return notify('Unknown campaign.',true);if(type==='regional'&&state.brandLevel<1)return notify('Unlock business branding to run regional campaigns.',true);let itemId=0;if(type==='targeted'){itemId=Number(document.getElementById('promoteItem')?.value||0);if(!state.inventory.some(x=>x.id===itemId&&x.listed))return notify('Choose a listed item to promote.',true)}const price=Math.round(opt.price*(state.marketingStaff>=2?.8:1));if(state.cash<price)return notify('You need '+cashfmt(price)+' for this campaign.',true);state.cash-=price;state.campaigns??=[];state.campaigns.push({type,itemId,until:state.day+opt.days-1});state.followers=(state.followers||0)+Math.round(opt.price/5);log('Started '+opt.label+' for '+cashfmt(price));save();notify(opt.label+' active for '+opt.days+' days.');}
function marketingUpgrade(type){const config={photo:[180,650],brand:[350,2200],staff:[450,2800]};const key=type==='photo'?'photoLevel':type==='brand'?'brandLevel':'marketingStaff';const arr=config[type];if(!arr)return;const level=state[key]||0;if(level>=2)return;const price=arr[level];if(state.cash<price)return notify('Not enough cash.',true);state.cash-=price;state[key]=level+1;log('Upgraded '+type+' to level '+state[key]);save();notify('Marketing upgrade purchased.');}
function marketing(){const listed=state.inventory.filter(x=>x.listed);const active=(state.campaigns||[]).filter(c=>c.until>=state.day);const level=(key)=>state[key]||0;const price=(type)=>cashfmt(CAMPAIGN_OPTIONS[type].price*(state.marketingStaff>=2?.8:1));return `<section class="panel"><h2>📣 Marketing & Reputation</h2><p class="muted">Grow your brand and attract customers. Advertising increases interest, but it won't rescue wildly overpriced stock.</p><div class="cards"><article class="card"><h3>📱 Followers</h3><div class="price">${(state.followers||0).toLocaleString('en-GB')}</div><p class="muted">${state.viralPosts||0} viral posts · organic reach improves as you grow</p></article><article class="card"><h3>⭐ Reputation</h3><div class="price">${state.rep}/100</div><p class="muted">Build trust by completing sales</p></article><article class="card"><h3>📢 Active campaigns</h3><div class="price">${active.length+(state.marketingDays>0?1:0)}</div><p class="muted">${active.length?active.map(c=>CAMPAIGN_OPTIONS[c.type]?.label+' ('+(c.until-state.day+1)+'d)').join(' · '):'No new campaigns running'}</p></article></div></section><section class="panel"><h2>Run a campaign</h2><div class="cards"><article class="card"><div class="art">📱</div><h3>Social post</h3><div class="price">FREE</div><p class="muted">One per day. Gain followers, with a chance to go viral. Better equipment and staff improve your reach.</p><button class="green" onclick="campaign('post')" ${state.freePostDay===state.day?'disabled':''}>${state.freePostDay===state.day?'Posted today':'Create post'}</button></article><article class="card"><div class="art">📍</div><h3>Local ads</h3><div class="price">${price('local')}</div><p class="muted">3 days · Boost interest in all listed stock.</p><button onclick="campaign('local')" ${state.cash<Number(CAMPAIGN_OPTIONS.local.price*(state.marketingStaff>=2?.8:1))?'disabled':''}>Advertise locally</button></article><article class="card"><div class="art">🚗</div><h3>Feature a listing</h3><div class="price">${price('targeted')}</div><p class="muted">4 days · Strong extra exposure for one item you choose.</p><select id="promoteItem" aria-label="Select stock to advertise"><option value="0">Choose listed stock</option>${listed.map(x=>`<option value="${x.id}">${x.name.replace(/&/g,'&amp;').replace(/</g,'&lt;')} · ${cashfmt(x.ask)}</option>`).join('')}</select><button onclick="campaign('targeted')" ${!listed.length?'disabled':''}>Promote this listing</button></article><article class="card"><div class="art">🌍</div><h3>Regional campaign</h3><div class="price">${price('regional')}</div><p class="muted">7 days · Reach a much wider audience. Requires a branded business.</p><button onclick="campaign('regional')" ${state.brandLevel<1||state.cash<Number(CAMPAIGN_OPTIONS.regional.price*(state.marketingStaff>=2?.8:1))?'disabled':''}>Launch campaign</button></article></div></section><section class="panel"><h2>Build your brand</h2><p class="muted">These upgrades make your marketing more effective. You still decide when to post and what to advertise.</p><div class="cards"><article class="card"><h3>📷 Photography kit · Level ${level('photoLevel')}/2</h3><p class="muted">More followers per post and a higher chance of going viral.</p><button class="green" onclick="marketingUpgrade('photo')" ${level('photoLevel')>=2?'disabled':''}>${level('photoLevel')>=2?'Maxed out':'Upgrade · '+cashfmt([180,650][level('photoLevel')])}</button></article><article class="card"><h3>🏪 Business branding · Level ${level('brandLevel')}/2</h3><p class="muted">Improve customer trust and unlock regional campaigns.</p><button class="green" onclick="marketingUpgrade('brand')" ${level('brandLevel')>=2?'disabled':''}>${level('brandLevel')>=2?'Maxed out':'Upgrade · '+cashfmt([350,2200][level('brandLevel')])}</button></article><article class="card"><h3>👥 Marketing staff · Level ${level('marketingStaff')}/2</h3><p class="muted">Level 1: social media assistant ($10/day). Level 2: marketing manager ($38/day), 20% cheaper paid ads.</p><button class="green" onclick="marketingUpgrade('staff')" ${level('marketingStaff')>=2?'disabled':''}>${level('marketingStaff')>=2?'Maxed out':'Hire / promote · '+cashfmt([450,2800][level('marketingStaff')])}</button></article></div></section>`}
function hire(role){state.staff??={lister:false,mechanic:false};const cost=role==='lister'?650:1100;if(state.staff[role])return;if(state.cash<cost)return notify('Not enough cash to hire.',true);state.cash-=cost;state.staff[role]=true;if(role==='lister')state.inventory.forEach(autoListItem);log('Hired '+(role==='lister'?'sales assistant':'mechanic'));save();notify('New staff hired!')}
function purchaseUpgrade(kind){const cost=kind==='autoRepair'?2200:kind==='auctionContact'?3500:0;if(!cost||state[kind])return;if(state.cash<cost)return notify('Not enough cash for this upgrade.',true);state.cash-=cost;state[kind]=true;log(kind==='autoRepair'?'Unlocked auto-preparation':'Made a deal with an auction insider');save();notify(kind==='autoRepair'?'Auto-preparation enabled. Repair costs still apply each day.':'Auction insider unlocked: 12% off auction opening prices and rival thresholds!');}
function starterFind(){if(state.starterClaimed)return notify('Starter bargain already claimed.',true);const x={id:state.nextId++,kind:'part',name:'Garage clearance tool kit',icon:'🧰',cost:20,retail:75,space:2,condition:1,repair:12,listed:false,ask:0,days:0};if(state.cash<20||used()+2>PROPS[state.property][2])return notify('Need $20 and 2 free storage spaces.',true);state.cash-=20;state.inventory.push(x);state.starterClaimed=true;log('Found a $20 garage clearance bargain!');save();notify('Nice find! Open Stock to list your tool kit.')}

function guide(){const pending=state.inventory.filter(x=>x.offer).length,unlisted=state.inventory.filter(x=>!x.listed).length,listed=state.inventory.filter(x=>x.listed).length;let title,desc,target,label;if(pending){title='You have a buyer offer!';desc='Open Inventory to accept or decline the offer and collect your money.';target='inventory';label='View buyer offers →'}else if(unlisted){title='Your stock needs listing';desc=`You have ${unlisted} item(s) not for sale yet. Open Inventory, choose a price and tap List for sale.`;target='inventory';label='List my items →'}else if(listed){title='Your items are for sale';desc='Your listings are live. Buyers may make offers during business hours. Browse more bargains or promote your stock while waiting.';target='market';label='Browse bargains →'}else if(state.day<=2&&state.sold===0){title='Find your first bargain';desc='You have $'+Math.round(state.cash)+' to start. Buy a cheap part in the Market, then list it for sale from Inventory.';target='market';label='Browse bargains →'}else{title='Time to source your next deal';desc='You have '+cashfmt(state.cash)+' available and '+state.sold+' completed sales. Browse fresh listings or head to the auction house for your next flip.';target='market';label='Find new stock →'}return `<section class="guide"><div class="row"><h2>✨ Your next step</h2></div><b>${title}</b><p>${desc}</p><button class="green" onclick="${target==='next'?'nextDay()':`switchTab('${target}')`}">${label}</button></section>`}
function switchTab(t){if(scrapRun){cancelAnimationFrame(scrapRun.frame);scrapRun=null;}if(t==='staff'){upgradeSection='staff';t='upgrades'}tab=t;message='';render()}
function setCategory(c){selectedCategory=c;render()}
function itemCard(x,source){fixLegacyCar(x);if(source==='market'){const r=valueText(x);return `<article class="card"><div class="art">${x.icon||'🚗'}</div><h3>${x.year?x.year+' ':''}${x.name}</h3><span class="tag">${x.kind==='car'?'Car':'Part'}</span><p class="muted">${x.kind==='car'?(x.miles||0).toLocaleString()+' miles · Condition unverified':(['Needs work','Used','Good'][x.condition])}</p><div class="price">${cashfmt(x.cost)}</div><p class="muted">Estimated resale: <b>${r}</b></p>${state.buyerTier>=3?`<span class="tag">${buyerHint(x)}</span>`:''}<div class="actions"><button class="green" onclick="buy(${x.id})">Buy now</button></div></article>`}const cond=['Needs repair','Used / fair','Good condition'][x.condition];const auction=source==='auction';const owned=source==='inventory';return `<article class="card"><div class="art">${x.icon||'🚗'}</div><h3>${x.year?x.year+' ':''}${x.name}</h3><span class="tag">${x.kind==='car'?'Vehicle':'Used part'}</span> <span class="tag">${cond}</span>${x.miles?`<p class="muted">${x.miles.toLocaleString()} miles</p>`:''}<p class="muted">${x.kind==='car'?'Parking: 1 bay':'Storage: '+x.space+' spaces'} · Estimated value: ${cashfmt(x.retail)}</p>${!owned?`<div class="row" style="margin-top:10px"><b>Product appeal</b><span>${appeal(x)}/100</span></div><div class="meter"><div style="width:${appeal(x)}%"></div></div><p class="muted">${appeal(x)>=75?'High demand':appeal(x)>=45?'Steady demand':'Niche item'} · Potential resale margin ${cashfmt(x.retail-x.cost)}</p>`:''}${owned?`<div class="price">Paid ${cashfmt(x.cost)}</div>${x.prepSpent?`<p class="muted">Preparation: ${cashfmt(x.prepSpent)} · Total invested: <b>${cashfmt(x.cost+x.prepSpent)}</b></p>`:""}${buyerActivity(x)}<div class="muted">${x.listed?'Listed for '+cashfmt(x.ask):'Not listed for sale'}</div>${`<div class="row"><b>Customer appeal</b><span id="appealscore${x.id}">${appeal(x)}/100</span></div><div class="meter"><div id="appealfill${x.id}" style="width:${appeal(x)}%"></div></div><p class="muted">${appeal(x)>75?'Popular price · likely to sell quickly':appeal(x)>45?'Fair interest · may take a few days':'Expensive listing · slower sales'} · Potential profit <span id="profit${x.id}">${cashfmt((x.ask||x.retail)-x.cost-(x.prepSpent||0))}</span></p>`}${x.offer?`<div class="notice">Buyer offers <b>${cashfmt(x.offer)}</b></div><div class="actions"><button class="green" onclick="accept(${x.id})">Accept offer</button><button class="outline" onclick="reject(${x.id})">Decline</button></div>`:''}<div class="actions">${x.condition<2?`<button class="orange" onclick="repair(${x.id})">Prepare ${cashfmt(x.repair||Math.round(x.retail*.08))}</button>`:''}</div><div class="price-picker"><label for="askrange${x.id}">Set asking price</label><div class="fields"><input id="ask${x.id}" oninput="previewAppeal(${x.id},this.value)" type="number" min="${priceBounds(x).min}" max="${priceBounds(x).max}" value="${Math.max(priceBounds(x).min,Math.min(priceBounds(x).max,x.ask||Math.round(x.retail*(x.condition===0?.65:x.condition===1?.85:1))))}" aria-label="Asking price"><button class="green" onclick="list(${x.id})">${x.listed?'Update price':'List for sale'}</button></div><input class="price-slider" id="askrange${x.id}" type="range" min="${priceBounds(x).min}" max="${priceBounds(x).max}" step="1" value="${Math.max(priceBounds(x).min,Math.min(priceBounds(x).max,x.ask||Math.round(x.retail*(x.condition===0?.65:x.condition===1?.85:1))))}" style="${priceSliderStyle(x,Math.max(priceBounds(x).min,Math.min(priceBounds(x).max,x.ask||Math.round(x.retail*(x.condition===0?.65:x.condition===1?.85:1)))))}" oninput="previewAppeal(${x.id},this.value)" aria-label="Slide to adjust asking price"><div class="row" style="justify-content:space-between"><small>${cashfmt(priceBounds(x).min)} (-${priceBounds(x).down}%)</small><small>${cashfmt(priceBounds(x).max)} (+${priceBounds(x).up}%)</small></div><p class="muted" id="pricedelta${x.id}">Red = below total invested · Green = profit</p><p class="muted" id="appeal${x.id}">Drag to preview demand and profit.</p></div>`:`<div class="price">${cashfmt((auction&&state.auctionContact?Math.max(5,Math.round(x.cost*.88)):x.cost)+(auction?Math.max(5,Math.round((state.auctionContact?x.cost*.88:x.cost)*.12))*x.bids:0))}</div><div class="actions"><button class="${auction?'orange':'green'}" onclick="buy(${x.id},${auction})">${auction?'Bid / buy':'Buy now'}</button></div>${auction?`<p class="muted">${x.bids?'Rival bids: '+x.bids:'Auction lot · Rival bidding possible'}</p>`:''}`}</article>`}
let scrapRun=null;
function scrapToday(){return state.scrapAttemptsDay===state.day?(state.scrapAttemptsToday||0):0}
function scrapFree(){return scrapToday()===0&&state.scrapFreeDay!==state.day}
function scrapPage(){const free=scrapFree();return `<section class="panel"><h2>Westside Breakers</h2><p class="muted">Try to recover a useful part from the scrapyard. One free search every game day, then $5 each for up to two more searches (3 total). The marker moves back and forth - stop it in the green zone.</p><div class="scrap-meter"><div id="scrap-zone" class="scrap-zone"></div><div id="scrap-gold" class="scrap-gold"></div><div id="scrap-needle" class="scrap-needle"></div></div><p id="scrap-result" class="muted">${scrapToday()>=3?'All 3 searches used today. Come back tomorrow.':free?'Your daily free search is ready.':'Next attempt costs $5.'}</p><button class="green" id="scrap-action" ${scrapToday()>=3?'disabled':''} onclick="scrapAction()">${scrapToday()>=3?'Come back tomorrow':free?'Start free search':'Start search · $5'}</button><p class="muted">Today: ${scrapToday()}/3 · All-time searches: ${state.scrapAttempts||0} · Finds go into Inventory. Your free search resets at 07:00 on the next game day.</p><button class="outline mini" onclick="switchTab('home')">Back to town</button></section>`}
function scrapAction(){if(scrapRun){scrapStop();return}if(scrapToday()>=3)return notify('You have used all 3 scrapyard searches today. Come back tomorrow.',true);const free=scrapFree();if(!free&&state.cash<5)return notify('You need $5 for another scrapyard search.',true);if(!free)state.cash-=5;else state.scrapFreeDay=state.day;state.scrapAttempts=(state.scrapAttempts||0)+1;state.scrapAttemptsToday=scrapToday()+1;state.scrapAttemptsDay=state.day;const zone=15+Math.random()*63,width=16;const gold=zone+width*.42;const meter=document.getElementById('scrap-zone'),g=document.getElementById('scrap-gold'),needle=document.getElementById('scrap-needle'),btn=document.getElementById('scrap-action'),result=document.getElementById('scrap-result');if(!meter||!btn)return;meter.style.left=zone+'%';meter.style.width=width+'%';g.style.left=gold+'%';g.style.width='3%';btn.textContent='STOP - Recover part';result.textContent='Stop the moving marker in green. Aim for gold for a rare find!';scrapRun={zone,width,gold,start:performance.now(),position:0};save();function animate(now){if(!scrapRun)return;const x=((now-scrapRun.start)*.075)%200;scrapRun.position=x<=100?x:200-x;needle.style.left=scrapRun.position+'%';scrapRun.frame=requestAnimationFrame(animate)}scrapRun.frame=requestAnimationFrame(animate)}
function scrapStop(){const r=scrapRun;if(!r)return;cancelAnimationFrame(r.frame);scrapRun=null;const pos=r.position;const success=pos>=r.zone&&pos<=r.zone+r.width;const perfect=success&&Math.abs(pos-(r.gold+1.5))<=2.8;const result=document.getElementById('scrap-result');if(!success){result.textContent='Missed! Just rusty scrap this time.';log('Scrapyard search found nothing.')}else{const choices=perfect?[['Rare alloy wheel set',190,390,8,'🛞'],['Vintage workshop sign',65,260,2,'🏁'],['Golden spanner',25,310,1,'🔧']]:[['Used alternator',18,70,3,'🔩'],['Headlight pair',15,55,2,'💡'],['Tool bundle',12,48,2,'🧰'],['Alloy wheel',18,65,3,'🛞'],['Old car stereo',8,34,1,'📻'],['Traffic cone',1,12,1,'🚧'],['Garden gnome',2,35,1,'🪴']];const t=choices[Math.floor(rand()*choices.length)];if(used()+t[3]>PROPS[state.property][2]){result.textContent='You found '+t[0]+', but your parts storage is full. It was left behind.'}else{const item={id:state.nextId++,kind:'part',name:t[0],icon:t[4],cost:0,retail:t[2],space:t[3],condition:2,repair:0,listed:false,ask:0,auction:false,days:0};state.inventory.push(item);result.textContent=(perfect?'PERFECT HIT! Rare find: ':'Recovered: ')+t[0]+' (estimated $'+t[2]+'). Added to inventory.';log('Recovered '+t[0]+' at the scrapyard.')}}save();const btn=document.getElementById('scrap-action');if(btn){btn.textContent=scrapToday()>=3?'Daily limit reached':'Search again · $5';btn.disabled=scrapToday()>=3;}openingToast(success?'Scrapyard find added to your inventory!':'Scrapyard search finished.');const cashEl=document.querySelector('.hud-center strong');if(cashEl)cashEl.textContent=cashfmt(state.cash)}
function home(){const offers=state.inventory.filter(x=>x.offer).length;return `${offers?`<section class="notice"><b>${offers} buyer offer(s) waiting</b> <button class="mini green" onclick="switchTab('inventory')">View offers</button></section>`:''}${state.starterClaimed?guide():''}${!state.starterClaimed?`<section class="panel"><h2>Your first deal</h2><p>A local garage is clearing out a tool kit worth around $75. Buy it for $20 and list it for sale.</p><button class="green" onclick="starterFind()">Buy tool kit · $20</button></section>`:''}<section class="panel scrap-feature"><div class="row" style="justify-content:space-between;align-items:center"><h2>Scrapyard</h2><span class="tag">${scrapToday()>=3?'Done for today':scrapFree()?'FREE SEARCH':'$5 / search'}</span></div><p class="muted">Try the timing challenge to recover spare parts. ${Math.max(0,3-scrapToday())} of 3 attempts left today.</p><button class="green" onclick="switchTab('scrap')">Visit scrapyard →</button></section><section class="town-map"><div class="town-heading"><h2>Explore town</h2><span>Tap a location to visit</span></div><div class="town-grid"><button class="town-place scrap-place" onclick="switchTab('scrap')"><span class="town-art">🔩</span><b>Scrapyard</b><small>${scrapToday()>=3?'3/3 searches used':scrapFree()?'FREE daily search':'$5 · '+(3-scrapToday())+' left'}</small></button><button class="town-place market-place" onclick="switchTab('market')"><span class="town-art">🏪</span><b>Trading Street</b><small>15 marketplace listings</small></button><button class="town-place auction-place" onclick="switchTab('auction')"><span class="town-art">🚗</span><b>Auction House</b><small>Bid against rival dealers</small></button><button class="town-place garage-place" onclick="switchTab('inventory')"><span class="town-art">🔧</span><b>Your Garage</b><small>Stock, repairs & sales</small></button><button class="town-place office-place" onclick="switchTab('staff')"><span class="town-art">👥</span><b>Staff Office</b><small>Hire better specialists</small></button><button class="town-place property-place" onclick="switchTab('property')"><span class="town-art">🏢</span><b>Property Agent</b><small>Expand storage & parking</small></button><button class="town-place upgrades-place" onclick="switchTab('upgrades')"><span class="town-art">⚡</span><b>Business Centre</b><small>Upgrades & marketing</small></button></div></section><section class="panel"><h2>Business statistics</h2><div class="empire-stats"><div><small>Net worth</small><strong>${cashfmt(worth())}</strong></div><div><small>Total sales</small><strong>${state.sold}</strong></div><div><small>Day</small><strong>${state.day}</strong></div><div><small>Current stock</small><strong>${state.inventory.length}</strong></div></div></section>`}
function market(){return `<section class="panel"><h2>Marketplace ${openingNote(8,20)}</h2><p class="muted">15 listings every day, up to 3 cars. Asking prices can be bargains or overpriced. Your buyer improves the resale estimates, but only a master will give a price verdict.</p><p class="muted">Current buyer: ${BUYER_TIERS[state.buyerTier||0].name} · <button class="mini outline" onclick="switchTab('staff')">Staff</button></p><div class="fields" style="margin:12px 0">${['all','part','car'].map(c=>`<button class="${selectedCategory===c?'':'outline'} mini" onclick="setCategory('${c}')">${c==='all'?'All 15':c==='part'?'Parts':'Cars'}</button>`).join('')}</div><div class="cards marketplace-grid">${state.market.filter(x=>selectedCategory==='all'||x.kind===selectedCategory).map(x=>itemCard(x,'market')).join('')||'<p class="empty">No listings in this category today.</p>'}</div></section>`}

function auctions(){if(activeAuction)return auctionRoom();return `<section class="panel"><h2>Vehicle Auction House ${openingNote(10,19)}</h2><p class="muted">Cars only. Hidden faults and uncertain resale values. Bid against three rival dealers; sometimes they overpay. Only your decision wins a car.</p><p class="muted">Inspector: ${INSPECT_TIERS[state.inspectorTier||0].name} · <button class="mini outline" onclick="switchTab('staff')">Staff</button></p><div class="cards">${state.auctions.filter(x=>x.kind==='car').map(x=>`<article class="card"><div class="art">${x.icon||'🚗'}</div><h3>${x.year||''} ${x.name}</h3><span class="tag">Condition unknown</span><p class="muted">${(x.miles||0).toLocaleString()} miles · Estimated value ${valueText(x,true)}</p><div class="price">Opening ${cashfmt(Math.max(50,Math.round(x.cost*(state.auctionContact?.88:1))))}</div><button class="orange" onclick="enterAuction(${x.id})" ${!isOpen(10,19)?'disabled':''}>Enter auction</button></article>`).join('')||'<p class="empty">No more cars today. Advance to the next day.</p>'}</div></section>`}

function auctionStep(v){return v<100?5:v<250?10:v<500?20:v<1000?25:v<5000?100:v<20000?250:v<100000?500:2000}
function auctionTime(){return activeAuction?Math.max(0,Math.ceil((activeAuction.deadline-Date.now())/1000)):0}
function enterAuction(id){if(!isOpen(10,19))return notify('Auction house is closed. Open 10:00–19:00.',true);const car=state.auctions.find(x=>x.id===id&&x.kind==='car');if(!car)return;const opening=Math.max(50,Math.round(car.cost*(state.auctionContact?.88:1)));const ceiling=car.rival*(state.auctionContact?.88:1);activeAuction={id,price:opening,leader:-1,round:0,ended:false,winner:-1,started:false,deadline:0,nextRivalAt:Infinity,bidders:Array.from({length:3},(_,i)=>({name:BIDDER_NAMES[Math.floor(rand()*BIDDER_NAMES.length)],limit:Math.round(ceiling*(.77+rand()*.35))})),feed:['Auctioneer: Opening bid '+cashfmt(opening)+'. Who will start?']};render()}
function startAuction(){const a=activeAuction;if(!a||a.started||a.ended)return;a.started=true;a.deadline=Date.now()+15000;a.nextRivalAt=Date.now()+2800+Math.floor(rand()*2200);a.feed.unshift('Auctioneer: Bidding is open!');render()}
function auctionBid(multiplier=1){const a=activeAuction;if(!a||a.ended||!a.started)return;if(a.leader===3)return notify('You are already the highest bidder. Wait for another dealer to bid.',true);if(auctionTime()===0){auctionTimeout();return}const car=state.auctions.find(x=>x.id===a.id);if(!car)return;const step=auctionStep(a.price);const amount=a.leader===-1?a.price+step*(multiplier-1):a.price+step*multiplier;if(carCount()>=PROPS[state.property][3])return notify('No free car spaces. Upgrade your property first.',true);if(amount>state.cash)return notify('You cannot bid more than your available cash.',true);a.price=amount;a.leader=3;a.round++;a.deadline=Date.now()+15000;a.nextRivalAt=Date.now()+1800+Math.floor(rand()*3500);a.feed.unshift('You bid '+cashfmt(amount));render()}
function auctionTick(){const a=activeAuction;if(!a||a.ended||!a.started)return;const now=Date.now();if(now>=a.deadline){auctionTimeout();return}if(now>=a.nextRivalAt){const nextStep=auctionStep(a.price);const challengers=a.bidders.map((b,i)=>({b,i})).filter(z=>z.i!==a.leader&&z.b.limit>=a.price+nextStep);if(challengers.length){const challenger=challengers[Math.floor(rand()*challengers.length)];a.price+=nextStep;a.leader=challenger.i;a.round++;a.deadline=Date.now()+15000;a.feed.unshift(challenger.b.name+' raises to '+cashfmt(a.price));a.nextRivalAt=Date.now()+2200+Math.floor(rand()*4300);render();return}a.nextRivalAt=Infinity;}const sec=document.getElementById('auction-seconds');if(sec)sec.textContent=auctionTime()+'s';const fill=document.getElementById('auction-timer-fill');if(fill)fill.style.width=Math.min(100,Math.max(0,(a.deadline-Date.now())/15000*100))+'%'}
function auctionTimeout(){const a=activeAuction;if(!a||a.ended)return;a.ended=true;a.winner=a.leader;if(a.leader===3){a.feed.unshift('SOLD! Your winning bid: '+cashfmt(a.price));}else if(a.leader>=0){a.feed.unshift('SOLD to '+a.bidders[a.leader].name+' for '+cashfmt(a.price));}else{a.feed.unshift('No bids. Lot withdrawn.')}render()}
function auctionPass(){const a=activeAuction;if(!a||a.ended)return;if(a.leader===3)return notify('You are winning. Wait for the countdown to finish, or walk away and forfeit your bid.',true);auctionLeave()}
function auctionCollect(){const a=activeAuction;if(!a||!a.ended||a.winner!==3)return;const car=state.auctions.find(x=>x.id===a.id);if(!car)return;if(a.price>state.cash)return notify('Not enough cash to settle your winning bid.',true);if(carCount()>=PROPS[state.property][3])return notify('No available car space to collect the car.',true);state.cash-=a.price;state.auctions.splice(state.auctions.indexOf(car),1);const owned={...car,cost:a.price,listed:false,ask:0,auction:false};revealCar(owned);state.inventory.push(owned);log('Inspection: '+FAULTS[owned.faultIndex][3]+' Actual value '+cashfmt(owned.retail));log('Won '+car.name+' at auction for '+cashfmt(a.price));activeAuction=null;save();notify('Auction won! Inspection found: '+FAULTS[owned.faultIndex][0]+'. Actual value '+cashfmt(owned.retail)+'.');tab='inventory';render()}
function auctionLeave(){const a=activeAuction;if(!a)return;if(a.ended&&a.winner===3)return notify('Collect your winning car before leaving.',true);if(!a.ended){a.ended=true;a.winner=-2;}const index=state.auctions.findIndex(x=>x.id===a.id);if(index>=0)state.auctions.splice(index,1);activeAuction=null;save();render()}
function auctionRoom(){const a=activeAuction,car=state.auctions.find(x=>x.id===a.id);if(!car){activeAuction=null;return auctions()}const step=auctionStep(a.price);const next=a.leader===-1?a.price:a.price+step;return `<section class="panel"><button class="outline mini" onclick="auctionLeave()">← ${a.ended?'Leave auction':'Walk away'}</button><div class="auction-stage"><div class="auction-car"><div class="auction-emoji">${car.icon||'🚗'}</div><h2>${car.year||''} ${car.name}</h2><p class="muted">${(car.miles||0).toLocaleString()} miles · Condition unknown · Estimated value ${valueText(car,true)}</p><div class="notice"><b>Inspector:</b> ${inspectHint(car)}</div></div><div class="auction-live"><span class="tag">${a.ended?'AUCTION FINISHED':a.started?'LIVE BIDDING':'AUCTION PREVIEW'}</span>${!a.ended&&a.started?`<div class="auction-clock"><span>TIME REMAINING</span><strong id="auction-seconds">${auctionTime()}s</strong><div class="timer-track"><div id="auction-timer-fill" style="width:${Math.min(100,auctionTime()/15*100)}%"></div></div></div>`:''}<p class="muted">Current bid</p><div class="auction-price">${cashfmt(a.price)}</div><p>${a.leader===3?'You are highest bidder':a.leader<0?'Waiting for opening bid':a.bidders[a.leader].name+' is highest bidder'}</p><p class="muted">Minimum raise ${cashfmt(step)} · Your cash ${cashfmt(state.cash)}</p>${!a.started&&!a.ended?`<div class="auction-start"><p>Check the vehicle and your inspector's advice. The 15-second clock will start only when you're ready.</p><button class="green" onclick="startAuction()">Start auction →</button></div>`:a.ended?(a.winner===3?`<button class="green" onclick="auctionCollect()">Collect car · ${cashfmt(a.price)}</button>`:`<button onclick="auctionLeave()">Back to auction house</button>`):`<div class="bid-choices">${[1,2,5,10].map(m=>`<button class="${m===1?'orange':'outline'}" ${a.leader===3||next+step*(m-1)>state.cash||carCount()>=PROPS[state.property][3]?'disabled':''} onclick="auctionBid(${m})">+${cashfmt(step*m)}<small>${m===1&&a.leader===-1?'Opening bid':'Raise'}</small></button>`).join('')}</div><div class="actions"><button class="outline" onclick="auctionPass()">${a.leader===3?'Wait for the hammer':'Pass on this car'}</button></div>`}<div class="auction-feed">${a.feed.slice(0,7).map(t=>`<div>${t}</div>`).join('')}</div></div></div></section>`}
function buyerCycleMinutes(x){return Math.max(38,Math.round(115-appeal(x)*.55))}
function buyerProgress(x){if(!x.listed||!isOpen(8,21))return 0;return Math.min(100,Math.max(0,Math.round((state.clockMinute-(x.lastBuyerCheck??state.clockMinute))/buyerCycleMinutes(x)*100)))}
function buyerActivity(x){if(!x.listed)return '';if(x.offer)return '<div class="buyer-activity"><b>Buyer offer received</b></div>';const open=isOpen(8,21);return `<div class="buyer-activity"><div class="row"><b>${open?'Next buyer opportunity':'Buyers offline'}</b><small>${open?'Appeal '+appeal(x)+'/100':'08:00–21:00'}</small></div><div class="buyer-track"><div class="buyer-fill" data-item="${x.id}" style="width:${buyerProgress(x)}%"></div></div><small class="muted">${open?'Higher appeal fills this bar faster. Each full bar is a chance of an offer.':'Progress resumes when buyers return at 08:00.'}</small></div>`}

function inventory(){return `<section class="panel"><h2>Inventory & Sales</h2><p class="muted">Tip: Try listing close to estimated value. A lower price improves customer appeal and sells faster. Use Marketing to attract more buyers.</p><div class="cards">${state.inventory.map(x=>itemCard(x,'inventory')).join('')||'<p class="empty">Your shelves are empty. Buy your first item in the Marketplace.</p>'}</div></section>`}
function property(){const next=PROPS[state.property+1];return `<section class="panel"><h2>🏠 Property & Expansion</h2><p class="muted">Each property increases parts storage and eventually adds separate parking for car trading. Property upgrades are permanent.</p><div class="card"><h3>Current: ${PROPS[state.property][0]}</h3><p>Parts storage: ${used()} / ${PROPS[state.property][2]}</p><p>Vehicle bays: ${carCount()} / ${PROPS[state.property][3]}</p><p>Daily running costs: ${cashfmt(PROPS[state.property][4])}</p></div>${next?`<div class="card" style="margin-top:12px"><span class="tag">NEXT UPGRADE</span><h3>${next[0]}</h3><div class="price">${cashfmt(next[1])}</div><p>Storage: ${next[2]} spaces · Car bays: ${next[3]}</p><p>Daily costs: ${cashfmt(next[4])}</p><button class="green" ${state.cash<next[1]?'disabled':''} onclick="upgrade()">Buy property</button></div>`:'<p>Maximum property unlocked!</p>'}<p class="muted">Progression tip: Start with small used parts, move to wheel sets, then unlock a garage and start buying cars.</p></section>`}
function helpPage(){return `<section class="panel help-guide"><h2>Game guide</h2><p>This is the detailed mechanics guide. If you're new, start with the short interactive tutorial instead.</p><button class="green" onclick="openTutorial()">Replay the quick start</button>
<details open><summary>1. Buying and selling stock</summary><p>Start with $100. Browse the Marketplace, compare the seller's price with your estimated resale range, and buy items that fit your cash and storage limits. Purchases go to <b>Stock</b> - they do not sell automatically.</p><p>In Stock, prepare damaged items if you wish, set an asking price and press <b>List for sale</b>. After you end the day, buyers may make offers. You decide whether to accept or decline. Your asking price, condition, reputation and marketing affect customer interest. Higher prices generally mean slower sales.</p></details>
<details><summary>2. Marketplace prices and buyer specialists</summary><p>The Marketplace generates 15 listings each day, including up to three cars. Sellers can price items as steals, fairly priced, near retail, or expensive. These labels are hidden by default. Everyone sees an approximate resale-value range; junior, experienced and master buyers narrow that range. Only the master buyer gives a bargain/fair/overpriced verdict. Estimates are imperfect, especially for cars with hidden problems.</p></details>
<details><summary>3. Auctions and bidding</summary><p>Auctions contain <b>cars only</b>. Tap <b>Enter auction</b> to join a timed sale against rival dealers. Starting bids can be far below a vehicle's value. Choose a bid increment; the minimum increment scales with the current price. Rivals have their own budgets and may overpay. Each bid resets a real-time 15-second countdown. Rivals may respond after a few seconds, and the auction only ends when the clock reaches zero. If you're the highest bidder when it ends, you can collect the car if you have enough cash and parking space.</p><p>Never assume a cheap auction car is profitable. Hidden faults can make its actual resale value much lower than expected.</p></details>
<details><summary>4. Hidden faults, valuations and repairs</summary><p>A car may have a healthy engine, minor service needs, worn suspension, clutch trouble, gearbox damage or a blown head gasket. Before buying, you see only an estimate. Auction inspectors provide increasingly useful warnings. Once a car is yours, the true condition and value are revealed. Preparing or repairing stock costs money, but can improve condition and sale appeal.</p></details>
<details><summary>5. Staff and wages</summary><p>Open <b>Upgrades → Staff</b> to hire employees. Marketplace buyers improve valuation estimates; auction inspectors assess cars; sales assistants can list stock; mechanics reduce repair costs. Higher-tier specialists replace lower-tier ones. Staff charge daily wages, so don't hire too early. They never make purchase, auction-bidding or offer-acceptance decisions for you.</p></details>
<details><summary>6. Storage and property</summary><p>Parts use storage capacity; cars use separate parking spaces. Both are shown at the top of every page. If you have no free capacity, you can't take on more stock of that type. Property upgrades increase your available room, and larger premises have running costs.</p></details>
<details><summary>7. Marketing and reputation</summary><p>Free social posts build followers and can occasionally go viral. Paid local, targeted and regional campaigns increase the chance of attracting buyers. Targeted campaigns can promote an individual listing. Better photography, branding and marketing staff improve reach or efficiency. Advertising does not guarantee a sale, especially if the asking price is too high.</p></details>
<details><summary>8. Business upgrades and daily costs</summary><p>The auto-repair workshop can prepare damaged stock at day end when you can afford it. An auction insider reduces opening prices and rivals' bidding limits. Customer offers arrive during opening hours. The clock freezes at midnight; sleep to begin the next day at 07:00, pay overheads and refresh marketplace stock. Check your cash before ending the day.</p></details>
<details><summary>9. Saving your game</summary><p>The game saves automatically in this browser using localStorage. Closing Safari or updating the website normally preserves progress. Private browsing, clearing website data or moving to another device can lose access to that save. Don't clear website data unless you want to reset.</p></details>
</section>`}
function buyHub(){return `<section class="panel"><h2>Buy stock</h2><p class="muted">Choose where to hunt for your next deal.</p><div class="section-choice"><button onclick="switchTab('market')"><strong>Marketplace</strong><small>15 fresh listings · Parts and cars</small></button><button onclick="switchTab('auction')"><strong>Vehicle auctions</strong><small>Live bidding · Hidden faults</small></button></div></section>`}
function sellPage(){const listed=state.inventory.filter(x=>x.listed||x.offer);return `<section class="panel"><h2>Sell your stock</h2><p class="muted">Manage active listings and respond to customer offers. To list an unlisted item, open Stock.</p><div class="cards">${listed.map(x=>itemCard(x,'inventory')).join('')||'<p class="empty">No active listings yet. Open Stock to list an item for sale.</p>'}</div><div class="actions"><button class="outline" onclick="switchTab('inventory')">View all stock</button></div></section>`}
function manageHub(){return `<section class="panel"><h2>Manage your business</h2><p class="muted">Your office for staff, advertising, property and upgrades.</p><div class="section-choice"><button onclick="switchTab('staff')"><strong>Staff</strong><small>Hire and improve your team</small></button><button onclick="switchTab('marketing')"><strong>Marketing</strong><small>Social posts and advertising</small></button><button onclick="switchTab('property')"><strong>Property</strong><small>More storage and car spaces</small></button><button onclick="upgradeSection='business';switchTab('upgrades')"><strong>Upgrades</strong><small>Workshop and auction perks</small></button><button onclick="switchTab('saves')"><strong>Save files</strong><small>Switch between three games</small></button><button onclick="switchTab('arcade')"><strong>Casino</strong><small>Blackjack and slots</small></button></div></section><section class="panel"><h2>Business at a glance</h2><div class="empire-stats"><div><small>Net worth</small><strong>${cashfmt(worth())}</strong></div><div><small>Total sales</small><strong>${state.sold}</strong></div><div><small>Stock items</small><strong>${state.inventory.length}</strong></div></div></section>`}
function render(){
const root=document.getElementById('app');
const partsMax=PROPS[state.property][2],carsMax=PROPS[state.property][3];
const partsPct=partsMax?Math.min(100,100*used()/partsMax):0,carsPct=carsMax?Math.min(100,100*carCount()/carsMax):0;
const main=tab==='home'?home():tab==='scrap'?scrapPage():tab==='buy'?buyHub():tab==='sell'?sellPage():tab==='manage'?manageHub():tab==='market'?market():tab==='auction'?auctions():tab==='inventory'?inventory():tab==='property'?property():tab==='upgrades'?upgrades():tab==='staff'?staffPage():tab==='help'?helpPage():tab==='saves'?saveManager():tab==='arcade'?casino():marketing();
const activeNav=['market','auction','inventory'].includes(tab)?tab:tab==='buy'?'market':['manage','staff','marketing','property','upgrades','help','saves','arcade'].includes(tab)?'manage':'';
root.innerHTML=`<header class="game-hud"><div class="hud-inner"><div class="hud-top"><button class="hud-home" onclick="switchTab('home')">⌂ Home</button><div class="hud-center"><small>DAY ${state.day} · <span id="game-clock">${clockText()}</span></small><strong>${cashfmt(state.cash)}</strong></div><button class="hud-end" onclick="nextDay()">${state.clockMinute>=1440?'New Day':'Sleep / Next Day'}</button></div><div class="hud-capacity"><div class="hud-cap-row"><span>Parts storage</span><div class="track"><div class="fill" style="width:${partsPct}%;background:${partsPct>=100?'#e78d43':'#29bf8b'}"></div></div><span class="amount">${used()}/${partsMax}</span></div><div class="hud-cap-row"><span>Car spaces</span><div class="track"><div class="fill" style="width:${carsPct}%;background:${carsPct>=100?'#e78d43':'#57a8f2'}"></div></div><span class="amount">${carCount()}/${carsMax}</span></div></div></div></header><div class="layout"><main class="content">${message?`<div class="notice ${message.startsWith('ERROR')?'bad':''}">${message}</div>`:''}${main}<div class="help-footer">${tab==='help'?`<button class="outline" onclick="openTutorial()">Replay quick start tutorial</button>`:`<button class="outline" onclick="switchTab('help')">Help & full game guide</button>`}<div class="row section" style="justify-content:center"><button class="outline mini" onclick="switchTab('saves')">Manage save files</button></div></div><div class="footer">Trading Empire: Automotive · Alpha 4.11.1 · Auto-saves locally in this browser</div></main><nav class="nav" aria-label="Main navigation">${[['market','▤','MARKET'],['auction','⚒','AUCTIONS'],['inventory','▣','INVENTORY'],['manage','▦','BUSINESS']].map(([id,icon,label])=>`<button class="${activeNav===id?'active':''}" onclick="switchTab('${id}')"><span class="nav-icon">${icon}</span><span class="nav-label">${label}</span></button>`).join('')}</nav></div>${tutorialMarkup()}`;
}

setInterval(auctionTick,200);setInterval(timeTick,450);
load();if(state.tutorialCompleted===false||(state.day===1&&state.sold===0&&!state.starterClaimed&&state.inventory.length===0))tutorialStep=0;render();
</script></body></html>
