const cashfmt=n=>'£'+Math.round(n).toLocaleString('en-GB');let state,tab='home',message='',selectedCategory='all',activeAuction=null;

 ['🛒','Find your first bargain','You start with £100. Visit the Market and buy a cheap used part. Check the price, estimated resale value and available storage.'],

const BIDDER_NAMES=['Mason Motors','Northside Autos','Redline Traders','Harbour Cars','Parkway Sales','Elite Vehicle Co'];
const BUYER_TIERS=[{name:'No specialist',price:0,wage:0,spread:.53},{name:'Junior buyer',price:650,wage:8,spread:.32},{name:'Experienced buyer',price:2800,wage:24,spread:.16},{name:'Master buyer',price:11000,wage:65,spread:.055}];
const INSPECT_TIERS=[{name:'No inspector',price:0,wage:0,spread:.55},{name:'Junior inspector',price:1500,wage:12,spread:.35},{name:'Senior inspector',price:6000,wage:35,spread:.18},{name:'Master appraiser',price:20000,wage:85,spread:.07}];
const FAULTS=[['Runs well',0,2,'Sounds healthy enough to me.','Starts and drives normally.'],['Minor service needed',.055,1,'Might need a bit of attention, nothing obvious.','Some routine maintenance needed.'],['Worn suspension',.14,1,'There is a knock underneath. Could be suspension.','Suspension requires work.'],['Clutch slipping',.27,0,'Clutch feels a little tired. I would be careful.','Clutch replacement required.'],['Gearbox trouble',.43,0,'That gearbox does not sound happy.','Gearbox has a serious fault.'],['Head gasket failure',.64,0,'I do not like that exhaust smoke or the cooling system.','Blown head gasket. Major engine work needed.']];
function truth(x){return Math.max(5,Math.round(x.trueValue||x.retail||100))}
function pricing(x){const v=truth(x),ratio=x.cost/v;return ratio<.72?'Steal':ratio<.96?'Fairly priced':ratio<1.12?'Retail price':'Expensive'}
function valuation(x,tier,auction=false){const cfg=(auction?INSPECT_TIERS:BUYER_TIERS)[tier]||BUYER_TIERS[0];const v=truth(x);const drift=((x.id*37%17)-8)/8*cfg.spread*.26;const mid=v*(1+drift);return [Math.max(1,Math.round(mid*(1-cfg.spread)/10)*10),Math.round(mid*(1+cfg.spread)/10)*10]}
function valueText(x,auction=false){const tier=auction?(state.inspectorTier||0):(state.buyerTier||0),r=valuation(x,tier,auction);return cashfmt(r[0])+'–'+cashfmt(r[1])}
function inspectHint(x){const tier=state.inspectorTier||0;if(!tier)return 'No mechanical assessment available. The true condition is unknown.';const f=FAULTS[x.faultIndex??0];if(tier===1)return x.faultIndex>=3?'Something sounds off. I would not bid too high.':x.faultIndex>=1?'A few things might need attention.':'Seems alright from a distance.';if(tier===2)return x.faultIndex>=2?f[3]:f[3];return f[2]+' Likely fault: '+f[0]+'.';}
function buyerHint(x){if((state.buyerTier||0)<3)return '';const c=pricing(x);return c==='Steal'?'Likely bargain':c==='Fairly priced'?'Fair asking price':c==='Retail price'?'Around retail value':'Looks overpriced'}
function ensureRisk(x){if(x.kind!=='car')return;x.trueValue??=x.retail;if(x.faultIndex===undefined){x.faultIndex=x.condition===0?3:x.condition===1?1:0;x.undisclosed=true;}x.healthyValue??=Math.round(x.trueValue/(1-(FAULTS[x.faultIndex]?.[1]||0)));x.repair??=Math.round(x.healthyValue*(FAULTS[x.faultIndex]?.[1]||0));}
function revealCar(x){ensureRisk(x);x.retail=truth(x);x.condition=FAULTS[x.faultIndex][2];x.repair=Math.max(0,Math.round(x.healthyValue-x.trueValue));x.revealed=true;}
function rollCarRisk(x){const r=rand();x.faultIndex=r<.32?0:r<.52?1:r<.7?2:r<.82?3:r<.93?4:5;const f=FAULTS[x.faultIndex];x.healthyValue=x.retail;x.trueValue=Math.max(100,Math.round(x.healthyValue*(1-f[1])));x.condition=f[2];x.repair=Math.max(0,x.healthyValue-x.trueValue);x.revealed=false;return x}
function marketPrice(x){const r=rand();const factor=r<.15?.40+rand()*.3:r<.55?.75+rand()*.2:r<.85?.96+rand()*.15:1.16+rand()*.34;x.cost=Math.max(5,Math.round(truth(x)*factor));return x}
function staffWages(){return (state.staff.lister?12:0)+(state.staff.mechanic?18:0)+BUYER_TIERS[state.buyerTier||0].wage+INSPECT_TIERS[state.inspectorTier||0].wage+[0,10,38][state.marketingStaff||0]}
function hireTier(type){const key=type==='buyer'?'buyerTier':'inspectorTier',tiers=type==='buyer'?BUYER_TIERS:INSPECT_TIERS;const next=(state[key]||0)+1;if(next>=tiers.length)return;const cost=tiers[next].price;if(state.cash<cost)return notify('Not enough cash to hire '+tiers[next].name+'.',true);state.cash-=cost;state[key]=next;log('Hired '+tiers[next].name);save();notify(tiers[next].name+' joined your team. Previous employee replaced.');}
function staffPage(){const make=(type,tiers)=>{const tier=state[type==='buyer'?'buyerTier':'inspectorTier']||0;return `<article class="card"><div class="art">${type==='buyer'?'🧑‍💼':'🧑‍🔧'}</div><h3>${type==='buyer'?'Marketplace buyer':'Auction inspector'}</h3><span class="tag">Current: ${tiers[tier].name}</span><p class="muted">${type==='buyer'?'Improves estimated resale price ranges on all 15 marketplace listings. Master identifies bargains.':'Narrows auction car valuations and offers increasingly specific warnings about hidden faults.'}</p>${tier<3?`<h3>Next: ${tiers[tier+1].name}</h3><div class="price">${cashfmt(tiers[tier+1].price)}</div><p class="muted">Replaces current specialist · ${cashfmt(tiers[tier+1].wage)}/day wage</p><button class="green" ${state.cash<tiers[tier+1].price?'disabled':''} onclick="hireTier('${type}')">Hire next level</button>`:'<p class="notice">Top level unlocked</p>'}</article>`};return `<section class="panel"><h2>👥 Your staff</h2><p class="muted">Staff give you better information. You still choose what to buy, bid on, repair and sell. Hiring the next level replaces the previous specialist.</p><div class="cards">${make('buyer',BUYER_TIERS)}${make('inspector',INSPECT_TIERS)}<article class="card"><div class="art">🧑‍💼</div><h3>Sales assistant</h3><p class="muted">Automatically lists stock. You approve offers and buy stock yourself.</p><div class="price">£650</div><button class="green" ${state.staff.lister||state.cash<650?'disabled':''} onclick="hire('lister')">${state.staff.lister?'Hired':'Hire'}</button></article><article class="card"><div class="art">🔧</div><h3>Workshop mechanic</h3><p class="muted">Cuts preparation costs by 40%.</p><div class="price">£1,100</div><button class="green" ${state.staff.mechanic||state.cash<1100?'disabled':''} onclick="hire('mechanic')">${state.staff.mechanic?'Hired':'Hire'}</button></article></div><p class="muted">Total daily wages: ${cashfmt(staffWages())}</p></section>`}

function rand(){state.seed=(Math.imul(state.seed,1664525)+1013904223)>>>0;return state.seed/4294967296}
function newLot(type,auction=false){const affordable=TYPES.filter(t=>t[1]<=Math.max(65,state.cash*1.8+state.revenue*.12));const pool=affordable.length?affordable:TYPES.slice(0,5);const t=pool[Math.floor(rand()*pool.length)];const condition=Math.floor(rand()*3);const base=Math.max(5,Math.round(t[1]*(.65+rand()*.55)));return{id:state.nextId++,kind:'part',name:t[0],icon:t[4],cost:base,retail:Math.round(t[2]*(.85+rand()*.35)),space:t[3],condition,repair:condition===0?Math.round(t[1]*.23):0,listed:false,ask:0,auction,days:0}}
function newCar(auction=false){const eligible=CAR_TYPES.filter(t=>t[2]<=Math.max(2500,state.cash*2+state.revenue*.15));const t=eligible[Math.floor(rand()*eligible.length)];const condition=Math.floor(rand()*3);const retail=Math.round(t[2]*(.85+rand()*.35));return{id:state.nextId++,kind:'car',name:t[0],year:t[1],icon:t[3],miles:Math.round((30+rand()*160))*1000,cost:Math.round(retail*(.48+rand()*.24)),retail,space:15,condition,repair:condition===0?Math.round(retail*.24):condition===1?Math.round(retail*.08):0,listed:false,ask:0,auction,days:0}}
function fixLegacyCar(x){if(x.kind==='car'){const old={'Ford Fiesta':'Kestrel City','Vauxhall Corsa':'Valken Sprint','BMW E46 320d':'Bavaro 320R','VW Golf GTI':'Kestrel GT','Mazda MX-5':'Velora Roadster','BMW E30':'Bavaro Classic','Porsche Boxster':'Velora Roadster','Range Rover':'Valken RS'};x.name=old[x.name]||x.name;const t=CAR_TYPES.find(t=>t[0]===x.name)||CAR_TYPES[0];if(!x.icon||x.icon==='undefined')x.icon=t[3];if(!Number.isFinite(x.retail)||x.retail<100)x.retail=t[2];if(!Number.isFinite(x.cost)||x.cost<1)x.cost=Math.round(x.retail*.6)}return x}
function refill(){const carSlots=state.day>2?Math.floor(rand()*4):0;state.market=Array.from({length:15-carSlots},()=>marketPrice(newLot()));state.market.push(...Array.from({length:carSlots},()=>marketPrice(rollCarRisk(newCar()))));state.market.sort(()=>rand()-.5);state.auctions=Array.from({length:6},()=>rollCarRisk(newCar(true)));state.auctions.forEach(x=>{x.cost=Math.max(50,Math.round(x.healthyValue*(.05+rand()*.08)));x.rival=Math.round(x.healthyValue*(.28+rand()*.88));x.bids=0})}

function initial(){state={cash:100,day:1,property:0,inventory:[],market:[],auctions:[],revenue:0,profit:0,sold:0,seed:73127,nextId:1,log:['Opened your business with £100. Find a bargain and flip it!'],rep:50,marketing:0,marketingDays:0,freePostDay:0,staff:{lister:false,mechanic:false},buyerTier:0,inspectorTier:0,starterClaimed:false,autoRepair:false,auctionContact:false,followers:0,brandLevel:0,photoLevel:0,marketingStaff:0,campaigns:[],targetedItem:0,viralPosts:0};refill();save()}

function load(){try{const s=JSON.parse(localStorage.getItem('tradingEmpireAutomotiveV1'));if(s&&typeof s.cash==='number'&&Array.isArray(s.inventory)){state=s;state.marketing??=0;state.marketingDays??=0;state.freePostDay??=0;state.staff??={lister:false,mechanic:false};state.buyerTier??=0;state.inspectorTier??=0;state.starterClaimed??=true;state.autoRepair??=false;state.auctionContact??=false;state.followers??=0;state.brandLevel??=0;state.photoLevel??=0;state.marketingStaff??=0;state.campaigns??=[];state.targetedItem??=0;state.viralPosts??=0;state.auctions=(state.auctions||[]).filter(x=>x.kind==='car');state.inventory.forEach(fixLegacyCar);(state.market||[]).forEach(fixLegacyCar);state.auctions.forEach(fixLegacyCar);state.inventory.filter(x=>x.kind==='car').forEach(x=>{ensureRisk(x);x.revealed=true});if(state.market.length!==15||state.market.filter(x=>x.kind==='car').length>3)refill();else state.market.filter(x=>x.kind==='car').forEach(ensureRisk);state.auctions.forEach(ensureRisk);save();return}}catch(e){}initial()}

function save(){try{localStorage.setItem('tradingEmpireAutomotiveV1',JSON.stringify(state))}catch(e){}}
function notify(s,err=false){message=(err?'ERROR: ':'')+s;render()}
function log(s){state.log.unshift('Day '+state.day+': '+s);state.log=state.log.slice(0,10)}
function used(){return state.inventory.reduce((s,x)=>s+(x.kind==='car'?0:x.space),0)}function carCount(){return state.inventory.filter(x=>x.kind==='car').length}
function worth(){return state.cash+PROPS[state.property][1]+state.inventory.reduce((s,x)=>s+x.retail*(x.condition===0?.55:x.condition===1?.8:1),0)}
function buy(id,auction=false){const source=auction?state.auctions:state.market;const x=source.find(x=>x.id===id);if(!x)return;const price=x.cost;if(state.cash<price)return notify('Not enough money.',true);if(x.kind!=='car'&&used()+x.space>PROPS[state.property][2])return notify('Not enough parts storage. Upgrade your property.',true);if(x.kind==='car'&&carCount()>=PROPS[state.property][3])return notify('No available car parking spaces.',true);state.cash-=price;source.splice(source.indexOf(x),1);const owned={...x,cost:price,listed:false,ask:0};if(owned.kind==='car')revealCar(owned);state.inventory.push(owned);log('Bought '+x.name+' for '+cashfmt(price));save();notify('Purchased '+x.name+' for '+cashfmt(price)+(owned.kind==='car'?'. Inspection: '+FAULTS[owned.faultIndex][3]+' Actual value '+cashfmt(owned.retail)+'.':''))}

function repair(id){const x=state.inventory.find(x=>x.id===id);if(!x||x.condition===2)return;const price=Math.max(1,Math.round((x.repair||x.retail*.08)*(state.staff.mechanic?.6:1)));if(state.cash<price)return notify('Not enough money for preparation.',true);state.cash-=price;x.prepSpent=(x.prepSpent||0)+price;x.condition=2;x.repair=0;x.listed=false;log('Prepared '+x.name+' for '+cashfmt(price));save();notify('Item prepared. Its value has improved.')}
function previewAppeal(id,val){const x=state.inventory.find(x=>x.id===id);if(!x)return;const price=Number(val);if(!Number.isFinite(price)||price<1)return;const el=document.getElementById('appeal'+id);if(el){const a=appeal({...x,ask:price});el.textContent=a+'/100 · Potential profit '+cashfmt(price-x.cost-(x.prepSpent||0));}}
function list(id){const x=state.inventory.find(x=>x.id===id);if(!x)return;const input=document.getElementById('ask'+id);const price=Math.round(Number(input?.value));if(!Number.isFinite(price)||price<1)return notify('Enter a valid asking price.',true);x.ask=price;x.listed=true;x.days=0;log('Listed '+x.name+' for '+cashfmt(price));save();notify('Listing published. Advance the day to attract buyers.')}
function accept(id){const x=state.inventory.find(x=>x.id===id);if(!x||!x.offer)return;const amount=x.offer;state.cash+=amount;state.revenue+=amount;state.profit+=amount-x.cost-(x.prepSpent||0);state.sold++;state.rep=Math.min(100,state.rep+1);state.followers=(state.followers||0)+Math.max(1,Math.round(2+rand()*8));state.inventory.splice(state.inventory.indexOf(x),1);log('Sold '+x.name+' for '+cashfmt(amount));save();notify('Sold for '+cashfmt(amount)+'!')}
function reject(id){const x=state.inventory.find(x=>x.id===id);if(x){x.offer=0;log('Declined an offer on '+x.name)}save();render()}
function upgrade(){const p=PROPS[state.property+1];if(!p)return;if(state.cash<p[1])return notify('Not enough cash.',true);state.cash-=p[1];state.property++;log('Moved into '+p[0]);save();notify('Property upgraded! You now have '+p[2]+' storage spaces.')}
function nextDay(){activeAuction=null;state.day++;state.marketingDays=Math.max(0,state.marketingDays-1);state.campaigns=(state.campaigns||[]).filter(c=>c.until>=state.day);const wages=staffWages();const rent=PROPS[state.property][4]+wages;state.cash-=rent;let sales=0,autoFixed=0,repairBill=0;if(state.autoRepair){for(const x of state.inventory){if(x.condition===2)continue;const cost=Math.max(1,Math.round((x.repair||x.retail*.08)*(state.staff.mechanic?.6:1)));if(state.cash<cost)continue;state.cash-=cost;x.prepSpent=(x.prepSpent||0)+cost;x.condition=2;x.repair=0;repairBill+=cost;autoFixed++;}}for(const x of state.inventory){if(state.staff.lister&&!x.listed){x.ask=Math.max(1,Math.round(x.retail*(x.condition===0?.68:x.condition===1?.84:.97)));x.listed=true;x.days=0}if(!x.listed)continue;x.days++;if(x.offer)continue;if(rand()<saleChance(x)){x.offer=Math.round(Math.min(x.ask,x.retail*(.78+rand()*.23)));sales++}}refill();log('New listings arrived; '+sales+' buyer offer(s). Overhead '+cashfmt(rent)+(autoFixed?'; auto-prepared '+autoFixed+' item(s) for '+cashfmt(repairBill):''));save();notify('Day '+state.day+' started. '+sales+' new offer(s) received.')}
function appeal(x){const ratio=(x.ask||x.retail)/Math.max(1,x.retail);const popular=['Tool bundle','Used car stereo','Alloy wheel','Headlight pair','Set of alloy wheels'];const base=x.kind==='car'?53:popular.includes(x.name)?78:58;return Math.max(5,Math.min(98,Math.round(base+(1-ratio)*95+(x.condition-1)*12+(state.rep-50)*.16)))}
function marketingBoost(x){let boost=1;const followers=state.followers||0;boost+=Math.min(.22,followers/20000);boost+=(state.brandLevel||0)*.035;boost+=(state.marketingStaff||0)*.035;if(state.freePostDay===state.day)boost*=1.15+(state.photoLevel||0)*.05;if(state.marketingDays>0)boost*=1.5;for(const c of state.campaigns||[]){if(c.until<state.day)continue;if(c.type==='local')boost*=1.35;if(c.type==='targeted'&&c.itemId===x.id)boost*=1.95;if(c.type==='regional')boost*=1.6;}return boost}
function saleChance(x){return Math.min(.94,Math.max(.02,appeal(x)/150*marketingBoost(x)))}
const CAMPAIGN_OPTIONS={local:{price:50,days:3,label:'Local advertising'},targeted:{price:200,days:4,label:'Featured stock campaign'},regional:{price:1000,days:7,label:'Regional advertising'}};
function campaign(type){if(type==='post'){if(state.freePostDay===state.day)return notify('Already posted today. Come back tomorrow.',true);state.freePostDay=state.day;const viral=rand()<(.06+.035*(state.photoLevel||0)+.025*(state.marketingStaff||0));const gained=Math.round((8+rand()*23)*(1+(state.photoLevel||0)*.65+(state.marketingStaff||0)*.4)*(viral?8:1));state.followers=(state.followers||0)+gained;if(viral)state.viralPosts=(state.viralPosts||0)+1;log('Posted on social media; gained '+gained+' followers'+(viral?' (viral post!)':''));save();return notify((viral?'Your post went viral! ':'Post published! ')+'Gained '+gained+' followers.')}const opt=CAMPAIGN_OPTIONS[type];if(!opt)return notify('Unknown campaign.',true);if(type==='regional'&&state.brandLevel<1)return notify('Unlock business branding to run regional campaigns.',true);let itemId=0;if(type==='targeted'){itemId=Number(document.getElementById('promoteItem')?.value||0);if(!state.inventory.some(x=>x.id===itemId&&x.listed))return notify('Choose a listed item to promote.',true)}const price=Math.round(opt.price*(state.marketingStaff>=2?.8:1));if(state.cash<price)return notify('You need '+cashfmt(price)+' for this campaign.',true);state.cash-=price;state.campaigns??=[];state.campaigns.push({type,itemId,until:state.day+opt.days-1});state.followers=(state.followers||0)+Math.round(opt.price/5);log('Started '+opt.label+' for '+cashfmt(price));save();notify(opt.label+' active for '+opt.days+' days.');}
function marketingUpgrade(type){const config={photo:[180,650],brand:[350,2200],staff:[450,2800]};const key=type==='photo'?'photoLevel':type==='brand'?'brandLevel':'marketingStaff';const arr=config[type];if(!arr)return;const level=state[key]||0;if(level>=2)return;const price=arr[level];if(state.cash<price)return notify('Not enough cash.',true);state.cash-=price;state[key]=level+1;log('Upgraded '+type+' to level '+state[key]);save();notify('Marketing upgrade purchased.');}
function marketing(){const listed=state.inventory.filter(x=>x.listed);const active=(state.campaigns||[]).filter(c=>c.until>=state.day);const level=(key)=>state[key]||0;const price=(type)=>cashfmt(CAMPAIGN_OPTIONS[type].price*(state.marketingStaff>=2?.8:1));return `<section class="panel"><h2>📣 Marketing & Reputation</h2><p class="muted">Grow your brand and attract customers. Advertising increases interest, but it won't rescue wildly overpriced stock.</p><div class="cards"><article class="card"><h3>📱 Followers</h3><div class="price">${(state.followers||0).toLocaleString('en-GB')}</div><p class="muted">${state.viralPosts||0} viral posts · organic reach improves as you grow</p></article><article class="card"><h3>⭐ Reputation</h3><div class="price">${state.rep}/100</div><p class="muted">Build trust by completing sales</p></article><article class="card"><h3>📢 Active campaigns</h3><div class="price">${active.length+(state.marketingDays>0?1:0)}</div><p class="muted">${active.length?active.map(c=>CAMPAIGN_OPTIONS[c.type]?.label+' ('+(c.until-state.day+1)+'d)').join(' · '):'No new campaigns running'}</p></article></div></section><section class="panel"><h2>Run a campaign</h2><div class="cards"><article class="card"><div class="art">📱</div><h3>Social post</h3><div class="price">FREE</div><p class="muted">One per day. Gain followers, with a chance to go viral. Better equipment and staff improve your reach.</p><button class="green" onclick="campaign('post')" ${state.freePostDay===state.day?'disabled':''}>${state.freePostDay===state.day?'Posted today':'Create post'}</button></article><article class="card"><div class="art">📍</div><h3>Local ads</h3><div class="price">${price('local')}</div><p class="muted">3 days · Boost interest in all listed stock.</p><button onclick="campaign('local')" ${state.cash<Number(CAMPAIGN_OPTIONS.local.price*(state.marketingStaff>=2?.8:1))?'disabled':''}>Advertise locally</button></article><article class="card"><div class="art">🚗</div><h3>Feature a listing</h3><div class="price">${price('targeted')}</div><p class="muted">4 days · Strong extra exposure for one item you choose.</p><select id="promoteItem" aria-label="Select stock to advertise"><option value="0">Choose listed stock</option>${listed.map(x=>`<option value="${x.id}">${x.name.replace(/&/g,'&amp;').replace(/</g,'&lt;')} · ${cashfmt(x.ask)}</option>`).join('')}</select><button onclick="campaign('targeted')" ${!listed.length?'disabled':''}>Promote this listing</button></article><article class="card"><div class="art">🌍</div><h3>Regional campaign</h3><div class="price">${price('regional')}</div><p class="muted">7 days · Reach a much wider audience. Requires a branded business.</p><button onclick="campaign('regional')" ${state.brandLevel<1||state.cash<Number(CAMPAIGN_OPTIONS.regional.price*(state.marketingStaff>=2?.8:1))?'disabled':''}>Launch campaign</button></article></div></section><section class="panel"><h2>Build your brand</h2><p class="muted">These upgrades make your marketing more effective. You still decide when to post and what to advertise.</p><div class="cards"><article class="card"><h3>📷 Photography kit · Level ${level('photoLevel')}/2</h3><p class="muted">More followers per post and a higher chance of going viral.</p><button class="green" onclick="marketingUpgrade('photo')" ${level('photoLevel')>=2?'disabled':''}>${level('photoLevel')>=2?'Maxed out':'Upgrade · '+cashfmt([180,650][level('photoLevel')])}</button></article><article class="card"><h3>🏪 Business branding · Level ${level('brandLevel')}/2</h3><p class="muted">Improve customer trust and unlock regional campaigns.</p><button class="green" onclick="marketingUpgrade('brand')" ${level('brandLevel')>=2?'disabled':''}>${level('brandLevel')>=2?'Maxed out':'Upgrade · '+cashfmt([350,2200][level('brandLevel')])}</button></article><article class="card"><h3>👥 Marketing staff · Level ${level('marketingStaff')}/2</h3><p class="muted">Level 1: social media assistant (£10/day). Level 2: marketing manager (£38/day), 20% cheaper paid ads.</p><button class="green" onclick="marketingUpgrade('staff')" ${level('marketingStaff')>=2?'disabled':''}>${level('marketingStaff')>=2?'Maxed out':'Hire / promote · '+cashfmt([450,2800][level('marketingStaff')])}</button></article></div></section>`}
function hire(role){state.staff??={lister:false,mechanic:false};const cost=role==='lister'?650:1100;if(state.staff[role])return;if(state.cash<cost)return notify('Not enough cash to hire.',true);state.cash-=cost;state.staff[role]=true;log('Hired '+(role==='lister'?'sales assistant':'mechanic'));save();notify('New staff hired!')}
function purchaseUpgrade(kind){const cost=kind==='autoRepair'?2200:kind==='auctionContact'?3500:0;if(!cost||state[kind])return;if(state.cash<cost)return notify('Not enough cash for this upgrade.',true);state.cash-=cost;state[kind]=true;log(kind==='autoRepair'?'Unlocked auto-preparation':'Made a deal with an auction insider');save();notify(kind==='autoRepair'?'Auto-preparation enabled. Repair costs still apply each day.':'Auction insider unlocked: 12% off auction opening prices and rival thresholds!');}
function starterFind(){if(state.starterClaimed)return notify('Starter bargain already claimed.',true);const x={id:state.nextId++,kind:'part',name:'Garage clearance tool kit',icon:'🧰',cost:20,retail:75,space:2,condition:1,repair:12,listed:false,ask:0,days:0};if(state.cash<20||used()+2>PROPS[state.property][2])return notify('Need £20 and 2 free storage spaces.',true);state.cash-=20;state.inventory.push(x);state.starterClaimed=true;log('Found a £20 garage clearance bargain!');save();notify('Nice find! Open Stock to list your tool kit.')}
let upgradeSection='business';
function setUpgradeSection(v){upgradeSection=v;render()}
function upgrades(){if(upgradeSection==='staff')return `<section class="panel"><h2>Business upgrades</h2><div class="fields"><button class="outline" onclick="setUpgradeSection('business')">Business upgrades</button><button onclick="setUpgradeSection('staff')">Staff</button></div></section>`+staffPage();return `<section class="panel"><h2>⚡ Business upgrades</h2><div class="fields" style="margin-bottom:14px"><button onclick="setUpgradeSection('business')">Business upgrades</button><button class="outline" onclick="setUpgradeSection('staff')">Staff</button></div><p class="muted">Automation handles repetitive jobs. You still choose purchases, bids, repairs and offers. <button class="mini outline" onclick="switchTab('staff')">Manage staff</button></p><div class="cards"><article class="card"><div class="art">🔧</div><h3>Auto-repair workshop</h3><div class="price">£2,200</div><p class="muted">Automatically prepares damaged stock at day end when affordable. Repair costs still apply.</p><button class="green" ${state.autoRepair||state.cash<2200?'disabled':''} onclick="purchaseUpgrade('autoRepair')">${state.autoRepair?'Unlocked':'Unlock'}</button></article><article class="card"><div class="art">🤝</div><h3>Auction insider</h3><div class="price">£3,500</div><p class="muted">Reduces opening bids and rival bidding limits by 12%. Still possible to overpay.</p><button class="orange" ${state.auctionContact||state.cash<3500?'disabled':''} onclick="purchaseUpgrade('auctionContact')">${state.auctionContact?'Unlocked':'Unlock'}</button></article></div></section>`}

function guide(){const pending=state.inventory.filter(x=>x.offer).length,unlisted=state.inventory.filter(x=>!x.listed).length,listed=state.inventory.filter(x=>x.listed).length;let title,desc,target,label;if(pending){title='You have a buyer offer!';desc='Open Stock to accept or decline the offer and collect your money.';target='inventory';label='View buyer offers →'}else if(unlisted){title='Your stock needs listing';desc=`You have ${unlisted} item(s) not for sale yet. Open Stock, choose a price and tap List for sale.`;target='inventory';label='List my items →'}else if(listed){title='Your items are for sale';desc='Your listings are live. End the day to see if customers make offers. You can also promote your stock.';target='next';label='End day →'}else{title='Find your first bargain';desc='You have £'+Math.round(state.cash)+' to start. Buy a cheap part in the Market, then list it for sale from Stock.';target='market';label='Browse bargains →'}return `<section class="guide"><div class="row"><h2>✨ Your next step</h2></div><b>${title}</b><p>${desc}</p><button class="green" onclick="${target==='next'?'nextDay()':`switchTab('${target}')`}">${label}</button></section>`}

function setCategory(c){selectedCategory=c;render()}
function itemCard(x,source){fixLegacyCar(x);if(source==='market'){const r=valueText(x);return `<article class="card"><div class="art">${x.icon||'🚗'}</div><h3>${x.year?x.year+' ':''}${x.name}</h3><span class="tag">${x.kind==='car'?'Car':'Part'}</span><p class="muted">${x.kind==='car'?(x.miles||0).toLocaleString()+' miles · Condition unverified':(['Needs work','Used','Good'][x.condition])}</p><div class="price">${cashfmt(x.cost)}</div><p class="muted">Estimated resale: <b>${r}</b></p>${state.buyerTier>=3?`<span class="tag">${buyerHint(x)}</span>`:''}<div class="actions"><button class="green" onclick="buy(${x.id})">Buy now</button></div></article>`}const cond=['Needs repair','Used / fair','Good condition'][x.condition];const auction=source==='auction';const owned=source==='inventory';return `<article class="card"><div class="art">${x.icon||'🚗'}</div><h3>${x.year?x.year+' ':''}${x.name}</h3><span class="tag">${x.kind==='car'?'Vehicle':'Used part'}</span> <span class="tag">${cond}</span>${x.miles?`<p class="muted">${x.miles.toLocaleString()} miles</p>`:''}<p class="muted">${x.kind==='car'?'Parking: 1 bay':'Storage: '+x.space+' spaces'} · Estimated value: ${cashfmt(x.retail)}</p>${!owned?`<div class="row" style="margin-top:10px"><b>Product appeal</b><span>${appeal(x)}/100</span></div><div class="meter"><div style="width:${appeal(x)}%"></div></div><p class="muted">${appeal(x)>=75?'High demand':appeal(x)>=45?'Steady demand':'Niche item'} · Potential resale margin ${cashfmt(x.retail-x.cost)}</p>`:''}${owned?`<div class="price">Paid ${cashfmt(x.cost)}</div><div class="muted">${x.listed?'Listed for '+cashfmt(x.ask):'Not listed for sale'}</div>${`<div class="row"><b>Customer appeal</b><span>${appeal(x)}/100</span></div><div class="meter"><div style="width:${appeal(x)}%"></div></div><p class="muted">${appeal(x)>75?'Popular price · likely to sell quickly':appeal(x)>45?'Fair interest · may take a few days':'Expensive listing · slower sales'} · Potential profit ${cashfmt((x.ask||x.retail)-x.cost-(x.prepSpent||0))}</p>`}${x.offer?`<div class="notice">Buyer offers <b>${cashfmt(x.offer)}</b></div><div class="actions"><button class="green" onclick="accept(${x.id})">Accept offer</button><button class="outline" onclick="reject(${x.id})">Decline</button></div>`:''}<div class="actions">${x.condition<2?`<button class="orange" onclick="repair(${x.id})">Prepare ${cashfmt(x.repair||Math.round(x.retail*.08))}</button>`:''}</div><p class="muted" id="appeal${x.id}">Change the price to preview demand and profit.</p><div class="fields"><input id="ask${x.id}" oninput="previewAppeal(${x.id},this.value)" type="number" min="1" value="${x.ask||Math.round(x.retail*(x.condition===0?.65:x.condition===1?.85:1))}" aria-label="Asking price"><button class="green" onclick="list(${x.id})">${x.listed?'Update price':'List for sale'}</button></div>`:`<div class="price">${cashfmt((auction&&state.auctionContact?Math.max(5,Math.round(x.cost*.88)):x.cost)+(auction?Math.max(5,Math.round((state.auctionContact?x.cost*.88:x.cost)*.12))*x.bids:0))}</div><div class="actions"><button class="${auction?'orange':'green'}" onclick="buy(${x.id},${auction})">${auction?'Bid / buy':'Buy now'}</button></div>${auction?`<p class="muted">${x.bids?'Rival bids: '+x.bids:'Auction lot · Rival bidding possible'}</p>`:''}`}</article>`}
function home(){const offers=state.inventory.filter(x=>x.offer).length;return `<section class="panel welcome"><div class="row"><div><h2>Welcome to your trading town</h2><p class="muted">Day ${state.day} · ${cashfmt(state.cash)} available · ${offers} customer offers</p></div></div></section>${guide()}${!state.starterClaimed?`<section class="panel"><h2>Your first deal</h2><p>A local garage is clearing out a tool kit worth around £75. Buy it for £20 and list it for sale.</p><button class="green" onclick="starterFind()">Buy tool kit · £20</button></section>`:''}<section class="town-map"><div class="town-heading"><h2>Explore town</h2><span>Tap a location to visit</span></div><div class="town-grid"><button class="town-place market-place" onclick="switchTab('market')"><span class="town-art">🏪</span><b>Trading Street</b><small>15 marketplace listings</small></button><button class="town-place auction-place" onclick="switchTab('auction')"><span class="town-art">🚗</span><b>Auction House</b><small>Bid against rival dealers</small></button><button class="town-place garage-place" onclick="switchTab('inventory')"><span class="town-art">🔧</span><b>Your Garage</b><small>Stock, repairs & sales</small></button><button class="town-place office-place" onclick="switchTab('staff')"><span class="town-art">👥</span><b>Staff Office</b><small>Hire better specialists</small></button><button class="town-place property-place" onclick="switchTab('property')"><span class="town-art">🏢</span><b>Property Agent</b><small>Expand storage & parking</small></button><button class="town-place upgrades-place" onclick="switchTab('upgrades')"><span class="town-art">⚡</span><b>Business Centre</b><small>Upgrades & marketing</small></button></div></section><section class="panel"><div class="row"><div><h2>Your empire</h2><p class="muted">${PROPS[state.property][0]} · ${state.inventory.length} items in stock · ${state.sold} sales</p></div><b>${cashfmt(worth())}</b></div><div class="meter"><div style="width:${Math.min(100,worth()/10000)}%"></div></div><p class="muted">Next milestone: grow towards £1,000,000 net worth</p></section>`}
function market(){return `<section class="panel"><h2>🛒 Community Marketplace</h2><p class="muted">15 listings every day, up to 3 cars. Asking prices can be bargains or overpriced. Your buyer improves the resale estimates, but only a master will give a price verdict.</p><p class="muted">Current buyer: ${BUYER_TIERS[state.buyerTier||0].name} · <button class="mini outline" onclick="switchTab('staff')">Staff</button></p><div class="fields" style="margin:12px 0">${['all','part','car'].map(c=>`<button class="${selectedCategory===c?'':'outline'} mini" onclick="setCategory('${c}')">${c==='all'?'All 15':c==='part'?'Parts':'Cars'}</button>`).join('')}</div><div class="cards marketplace-grid">${state.market.filter(x=>selectedCategory==='all'||x.kind===selectedCategory).map(x=>itemCard(x,'market')).join('')||'<p class="empty">No listings in this category today.</p>'}</div></section>`}

function auctions(){if(activeAuction)return auctionRoom();return `<section class="panel"><h2>🔨 Vehicle Auction House</h2><p class="muted">Cars only. Hidden faults and uncertain resale values. Bid against three rival dealers; sometimes they overpay. Only your decision wins a car.</p><p class="muted">Inspector: ${INSPECT_TIERS[state.inspectorTier||0].name} · <button class="mini outline" onclick="switchTab('staff')">Staff</button></p><div class="cards">${state.auctions.filter(x=>x.kind==='car').map(x=>`<article class="card"><div class="art">${x.icon||'🚗'}</div><h3>${x.year||''} ${x.name}</h3><span class="tag">Condition unknown</span><p class="muted">${(x.miles||0).toLocaleString()} miles · Estimated value ${valueText(x,true)}</p><div class="price">Opening ${cashfmt(Math.max(50,Math.round(x.cost*(state.auctionContact?.88:1))))}</div><button class="orange" onclick="enterAuction(${x.id})">Enter auction</button></article>`).join('')||'<p class="empty">No more cars today. Advance to the next day.</p>'}</div></section>`}

function auctionStep(v){return v<1000?50:v<5000?100:v<20000?250:v<100000?500:2000}
function auctionTime(){return activeAuction?Math.max(0,Math.ceil((activeAuction.deadline-Date.now())/1000)):0}
function enterAuction(id){const car=state.auctions.find(x=>x.id===id&&x.kind==='car');if(!car)return;const opening=Math.max(50,Math.round(car.cost*(state.auctionContact?.88:1)));const ceiling=car.rival*(state.auctionContact?.88:1);activeAuction={id,price:opening,leader:-1,round:0,ended:false,winner:-1,deadline:Date.now()+25000,bidders:Array.from({length:3},(_,i)=>({name:BIDDER_NAMES[Math.floor(rand()*BIDDER_NAMES.length)],limit:Math.round(ceiling*(.77+rand()*.35))})),feed:['Auctioneer: Opening bid '+cashfmt(opening)+'. Who will start?']};render()}
function auctionBid(multiplier=1){const a=activeAuction;if(!a||a.ended)return;if(auctionTime()===0){auctionTimeout();return}const car=state.auctions.find(x=>x.id===a.id);if(!car)return;const step=auctionStep(a.price);const amount=a.leader===-1?a.price+step*(multiplier-1):a.price+step*multiplier;if(carCount()>=PROPS[state.property][3])return notify('No free car spaces. Upgrade your property first.',true);if(amount>state.cash)return notify('You cannot bid more than your available cash.',true);a.price=amount;a.leader=3;a.round++;a.deadline=Date.now()+15_000;a.feed.unshift('You bid '+cashfmt(amount));const challengers=a.bidders.map((b,i)=>({b,i})).filter(z=>z.b.limit>=a.price+auctionStep(a.price));if(challengers.length){const challenger=challengers[Math.floor(rand()*challengers.length)];a.price+=auctionStep(a.price);a.leader=challenger.i;a.deadline=Date.now()+15_000;a.feed.unshift(challenger.b.name+' raises to '+cashfmt(a.price));}render()}
function auctionTimeout(){const a=activeAuction;if(!a||a.ended)return;a.ended=true;a.winner=a.leader;if(a.leader===3){a.feed.unshift('SOLD! Your winning bid: '+cashfmt(a.price));}else if(a.leader>=0){a.feed.unshift('SOLD to '+a.bidders[a.leader].name+' for '+cashfmt(a.price));}else{a.feed.unshift('No bids. Lot withdrawn.')}render()}
function auctionPass(){const a=activeAuction;if(!a||a.ended)return;if(a.leader===3){a.deadline=Date.now()+3000;a.feed.unshift('You hold the highest bid. Auction closing shortly.');render();return}a.ended=true;a.winner=a.leader;a.feed.unshift(a.leader<0?'No bids. Lot withdrawn.':'You passed. Sold to '+a.bidders[a.leader].name+'.');render()}

function auctionCollect(){const a=activeAuction;if(!a||!a.ended||a.winner!==3)return;const car=state.auctions.find(x=>x.id===a.id);if(!car)return;if(a.price>state.cash)return notify('Not enough cash to settle your winning bid.',true);if(carCount()>=PROPS[state.property][3])return notify('No available car space to collect the car.',true);state.cash-=a.price;state.auctions.splice(state.auctions.indexOf(car),1);const owned={...car,cost:a.price,listed:false,ask:0,auction:false};revealCar(owned);state.inventory.push(owned);log('Inspection: '+FAULTS[owned.faultIndex][3]+' Actual value '+cashfmt(owned.retail));log('Won '+car.name+' at auction for '+cashfmt(a.price));activeAuction=null;save();notify('Auction won! Inspection found: '+FAULTS[owned.faultIndex][0]+'. Actual value '+cashfmt(owned.retail)+'.');tab='inventory';render()}
function auctionLeave(){const a=activeAuction;if(!a)return;if(a.ended&&a.winner===3)return notify('Collect your winning car before leaving.',true);if(!a.ended){a.ended=true;a.winner=-2;}const index=state.auctions.findIndex(x=>x.id===a.id);if(index>=0)state.auctions.splice(index,1);activeAuction=null;save();render()}
function auctionRoom(){const a=activeAuction,car=state.auctions.find(x=>x.id===a.id);if(!car){activeAuction=null;return auctions()}const step=auctionStep(a.price);const next=a.leader===-1?a.price:a.price+step;return `<section class="panel"><button class="outline mini" onclick="auctionLeave()">← ${a.ended?'Leave auction':'Walk away'}</button><div class="auction-stage"><div class="auction-car"><div class="auction-emoji">${car.icon||'🚗'}</div><h2>${car.year||''} ${car.name}</h2><p class="muted">${(car.miles||0).toLocaleString()} miles · Condition unknown · Estimated value ${valueText(car,true)}</p><div class="notice"><b>Inspector:</b> ${inspectHint(car)}</div></div><div class="auction-live"><span class="tag">${a.ended?'AUCTION FINISHED':'LIVE BIDDING'}</span>${!a.ended?`<div class="auction-clock"><span>TIME REMAINING</span><strong id="auction-seconds">${auctionTime()}s</strong><div class="timer-track"><div id="auction-timer-fill" style="width:${auctionTime()/25*100}%"></div></div></div>`:''}<p class="muted">Current bid</p><div class="auction-price">${cashfmt(a.price)}</div><p>${a.leader===3?'You are highest bidder':a.leader<0?'Waiting for opening bid':a.bidders[a.leader].name+' is highest bidder'}</p><p class="muted">Minimum raise ${cashfmt(step)} · Your cash ${cashfmt(state.cash)}</p>${a.ended?(a.winner===3?`<button class="green" onclick="auctionCollect()">Collect car · ${cashfmt(a.price)}</button>`:`<button onclick="auctionLeave()">Back to auction house</button>`):`<div class="bid-choices">${[1,2,5,10].map(m=>`<button class="${m===1?'orange':'outline'}" ${next+step*(m-1)>state.cash||carCount()>=PROPS[state.property][3]?'disabled':''} onclick="auctionBid(${m})">+${cashfmt(step*m)}<small>${m===1&&a.leader===-1?'Opening bid':'Raise'}</small></button>`).join('')}</div><div class="actions"><button class="outline" onclick="auctionPass()">${a.leader===3?'Close bidding early':'Pass on this car'}</button></div>`}<div class="auction-feed">${a.feed.slice(0,7).map(t=>`<div>${t}</div>`).join('')}</div></div></div></section>`}
function inventory(){return `<section class="panel"><h2>📦 My Inventory</h2><p class="muted">Tip: Try listing close to estimated value. A lower price improves customer appeal and sells faster. Use Marketing to attract more buyers.</p><div class="cards">${state.inventory.map(x=>itemCard(x,'inventory')).join('')||'<p class="empty">Your shelves are empty. Buy your first item in the Marketplace.</p>'}</div></section>`}
function property(){const next=PROPS[state.property+1];return `<section class="panel"><h2>🏠 Property & Expansion</h2><p class="muted">Each property increases parts storage and eventually adds separate parking for car trading. Property upgrades are permanent.</p><div class="card"><h3>Current: ${PROPS[state.property][0]}</h3><p>Parts storage: ${used()} / ${PROPS[state.property][2]}</p><p>Vehicle bays: ${carCount()} / ${PROPS[state.property][3]}</p><p>Daily running costs: ${cashfmt(PROPS[state.property][4])}</p></div>${next?`<div class="card" style="margin-top:12px"><span class="tag">NEXT UPGRADE</span><h3>${next[0]}</h3><div class="price">${cashfmt(next[1])}</div><p>Storage: ${next[2]} spaces · Car bays: ${next[3]}</p><p>Daily costs: ${cashfmt(next[4])}</p><button class="green" ${state.cash<next[1]?'disabled':''} onclick="upgrade()">Buy property</button></div>`:'<p>Maximum property unlocked!</p>'}<p class="muted">Progression tip: Start with small used parts, move to wheel sets, then unlock a garage and start buying cars.</p></section>`}
function helpPage(){return `<section class="panel help-guide"><h2>Game guide</h2><p>This is the detailed mechanics guide. If you're new, start with the short interactive tutorial instead.</p><button class="green" onclick="openTutorial()">Replay the quick start</button>
<details open><summary>1. Buying and selling stock</summary><p>Start with £100. Browse the Marketplace, compare the seller's price with your estimated resale range, and buy items that fit your cash and storage limits. Purchases go to <b>Stock</b> - they do not sell automatically.</p><p>In Stock, prepare damaged items if you wish, set an asking price and press <b>List for sale</b>. After you end the day, buyers may make offers. You decide whether to accept or decline. Your asking price, condition, reputation and marketing affect customer interest. Higher prices generally mean slower sales.</p></details>
<details><summary>2. Marketplace prices and buyer specialists</summary><p>The Marketplace generates 15 listings each day, including up to three cars. Sellers can price items as steals, fairly priced, near retail, or expensive. These labels are hidden by default. Everyone sees an approximate resale-value range; junior, experienced and master buyers narrow that range. Only the master buyer gives a bargain/fair/overpriced verdict. Estimates are imperfect, especially for cars with hidden problems.</p></details>
<details><summary>3. Auctions and bidding</summary><p>Auctions contain <b>cars only</b>. Tap <b>Enter auction</b> to join a timed sale against rival dealers. Starting bids can be far below a vehicle's value. Choose a bid increment; the minimum increment scales with the current price. Rivals have their own budgets and may overpay. Bidding resets the short countdown. If you're the highest bidder when it ends, you can collect the car if you have enough cash and parking space.</p><p>Never assume a cheap auction car is profitable. Hidden faults can make its actual resale value much lower than expected.</p></details>
<details><summary>4. Hidden faults, valuations and repairs</summary><p>A car may have a healthy engine, minor service needs, worn suspension, clutch trouble, gearbox damage or a blown head gasket. Before buying, you see only an estimate. Auction inspectors provide increasingly useful warnings. Once a car is yours, the true condition and value are revealed. Preparing or repairing stock costs money, but can improve condition and sale appeal.</p></details>
<details><summary>5. Staff and wages</summary><p>Open <b>Upgrades → Staff</b> to hire employees. Marketplace buyers improve valuation estimates; auction inspectors assess cars; sales assistants can list stock; mechanics reduce repair costs. Higher-tier specialists replace lower-tier ones. Staff charge daily wages, so don't hire too early. They never make purchase, auction-bidding or offer-acceptance decisions for you.</p></details>
<details><summary>6. Storage and property</summary><p>Parts use storage capacity; cars use separate parking spaces. Both are shown at the top of every page. If you have no free capacity, you can't take on more stock of that type. Property upgrades increase your available room, and larger premises have running costs.</p></details>
<details><summary>7. Marketing and reputation</summary><p>Free social posts build followers and can occasionally go viral. Paid local, targeted and regional campaigns increase the chance of attracting buyers. Targeted campaigns can promote an individual listing. Better photography, branding and marketing staff improve reach or efficiency. Advertising does not guarantee a sale, especially if the asking price is too high.</p></details>
<details><summary>8. Business upgrades and daily costs</summary><p>The auto-repair workshop can prepare damaged stock at day end when you can afford it. An auction insider reduces opening prices and rivals' bidding limits. At the end of each day, the game processes buyer interest, marketing effects, staff wages, property expenses and fresh marketplace stock. Check your cash before ending the day.</p></details>
<details><summary>9. Saving your game</summary><p>The game saves automatically in this browser using localStorage. Closing Safari or updating the website normally preserves progress. Private browsing, clearing website data or moving to another device can lose access to that save. Don't clear website data unless you want to reset.</p></details>
</section>`}
function render(){const root=document.getElementById('app');root.innerHTML=`<header class="top"><div class="brand">👑 TRADING EMPIRE <span>AUTOMOTIVE</span></div><div class="stats"><div class="pill"><small>DAY</small>${state.day}</div><div class="pill"><small>CASH</small>${cashfmt(state.cash)}</div><div class="pill"><small>NET WORTH</small>${cashfmt(worth())}</div><div class="pill"><small>SALES</small>${state.sold}</div></div></header><div class="storage-hud dual-hud"><div class="storage-hud-main"><div class="storage-hud-title"><span>📦 Parts storage</span><span>${used()} / ${PROPS[state.property][2]}</span></div><div class="storage-hud-track"><div class="storage-hud-fill" style="width:${PROPS[state.property][2]?Math.min(100,100*used()/PROPS[state.property][2]):0}%;background:${used()>=PROPS[state.property][2]?'#e78d43':'#29bf8b'}"></div></div></div><div class="storage-hud-main"><div class="storage-hud-title"><span>🚗 Car spaces</span><span>${carCount()} / ${PROPS[state.property][3]}</span></div><div class="storage-hud-track"><div class="storage-hud-fill" style="width:${PROPS[state.property][3]?Math.min(100,100*carCount()/PROPS[state.property][3]):0}%;background:${carCount()>=PROPS[state.property][3]?'#e78d43':'#57a8f2'}"></div></div></div><button class="storage-hud-action" onclick="switchTab('property')">Upgrade ↗</button></div><div class="layout"><main class="content">${message?`<div class="notice ${message.startsWith('ERROR')?'bad':''}">${message}</div>`:''}${tab==='home'?home():tab==='market'?market():tab==='auction'?auctions():tab==='inventory'?inventory():tab==='property'?property():tab==='upgrades'?upgrades():tab==='staff'?staffPage():tab==='help'?helpPage():marketing()}<div class="help-footer">${tab==='help'?`<button class="outline" onclick="openTutorial()">Replay quick start tutorial</button>`:`<button class="outline" onclick="switchTab('help')">❔ Help & full game guide</button>`}<div class="row section" style="justify-content:center"><button class="outline mini" onclick="if(confirm('Start a new game? Your current save will be erased.')){initial();tab='home';message='';render()}">New game / reset save</button></div></div><div class="footer">Trading Empire: Automotive · Alpha 4.3 · Auto-saves locally in this browser</div></main><nav class="nav" aria-label="Main navigation">${[['home','🏠','Home'],['market','🛒','Market'],['auction','🔨','Auctions'],['inventory','📦','Stock'],['property','🏢','Property'],['marketing','📣','Promote'],['upgrades','⚡','Upgrades']].map(([id,icon,label])=>`<button class="${tab===id?'active':''}" onclick="switchTab('${id}')"><span class="nav-icon">${icon}</span><span class="nav-label">${label}</span></button>`).join('')}<button class="end-day-nav" onclick="nextDay()"><span class="nav-icon">📅</span><span class="nav-label">End day</span></button></nav></div>${tutorialMarkup()}`}

load();try{if(!localStorage.getItem('tradingEmpireTutorialSeenV1'))tutorialStep=0}catch(e){tutorialStep=0}render();
</script></body></html>
